<!doctype html>
<html lang="ko" class="notranslate" translate="no">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<title>종합 예측 리포트 | WeatherLoad</title>

		<script src="https://cdn.tailwindcss.com"></script>
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

		<style>
			body {
				font-family:
					"Pretendard",
					-apple-system,
					sans-serif;
			}
			::-webkit-scrollbar {
				width: 6px;
				height: 6px;
			}
			::-webkit-scrollbar-thumb {
				background: #cbd5e1;
				border-radius: 3px;
			}

			@media print {
				body {
					background-color: white;
					padding: 0;
					margin: 0;
				}
				.no-print {
					display: none !important;
				}
				.print-container {
					max-width: 100% !important;
					margin: 0 !important;
					padding: 0 !important;
					box-shadow: none !important;
					border: none !important;
				}
				.print-break-inside-avoid {
					break-inside: avoid;
				}
			}
		</style>

		<script>
			tailwind.config = { theme: { extend: { colors: { brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" } } } } };
		</script>
	</head>
	<body class="bg-slate-50 text-slate-800 notranslate" translate="no">
		<div id="root"></div>

		<script type="text/babel">
			const { useState, useEffect, useRef } = React;

			const STATIONS = [
				{ id: "108", name: "서울" },
				{ id: "112", name: "인천" },
				{ id: "159", name: "부산" },
				{ id: "143", name: "대구" },
				{ id: "156", name: "광주" },
				{ id: "133", name: "대전" },
			];

			function Icon({ name, className = "w-4 h-4" }) {
				if (name === "printer")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
						</svg>
					);
				if (name === "file-text")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
						</svg>
					);
				if (name === "copy")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
						</svg>
					);
				if (name === "shield-check")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
						</svg>
					);
				if (name === "activity")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
						</svg>
					);
				return null;
			}

			function ReportPage() {
				const kstOffset = 9 * 60;
				const kstNow = new Date(new Date().getTime() + kstOffset * 60 * 1000);
				const prevMonth = new Date(kstNow.getTime() - 7 * 24 * 60 * 60 * 1000);
				const todayStr = kstNow.toISOString().split("T")[0];
				const startStr = prevMonth.toISOString().split("T")[0];

				const [station, setStation] = useState("108");
				const [startDate, setStartDate] = useState(startStr);
				const [endDate, setEndDate] = useState(todayStr);
				const [horizon, setHorizon] = useState("24h");

				const [loading, setLoading] = useState(false);
				const [reportData, setReportData] = useState(null);
				const [error, setError] = useState(null);
				const [viewMode, setViewMode] = useState("web");

				const trendChartRef = useRef(null);
				const trendInstance = useRef(null);

				const handleStartChange = (e) => {
					const newStart = e.target.value;
					setStartDate(newStart);
					if (endDate < newStart) setEndDate(newStart);
				};

				const handleEndChange = (e) => {
					const newEnd = e.target.value;
					setEndDate(newEnd);
					if (newEnd < startDate) setStartDate(newEnd);
				};

				const fetchReport = async () => {
					setLoading(true);
					setError(null);
					try {
						const res = await fetch(`/api/weather/report?stn=${station}&startDate=${startDate}&endDate=${endDate}&horizon=${horizon}`);
						if (!res.ok) throw new Error("데이터를 불러오지 못했습니다.");
						const result = await res.json();
						if (result.error) throw new Error(result.error);
						setReportData(result);
						setViewMode("web");
					} catch (err) {
						setError(err.message);
					} finally {
						setLoading(false);
					}
				};

				// 마운트 시 자동 로딩 및 Horizon 변경 시 즉각 반응
				useEffect(() => {
					fetchReport();
				}, []);
				useEffect(() => {
					if (reportData) fetchReport();
				}, [horizon]);

				useEffect(() => {
					if (!reportData || viewMode !== "web") return;

					// 과거와 미래 데이터를 끊김없이 연결하기 위한 레이블 통합 작업
					if (trendChartRef.current) {
						if (trendInstance.current) trendInstance.current.destroy();

						const histData = reportData.daily_trend || [];
						const fcstData = reportData.forecast && reportData.forecast.daily_trend ? reportData.forecast.daily_trend : [];

						// 중복을 제거한 전체 통합 날짜 레이블 (MM-DD)
						const allLabelsSet = new Set([...histData.map((d) => d.ymd.substring(5)), ...fcstData.map((d) => d.ymd.substring(5))]);
						const labels = Array.from(allLabelsSet).sort();

						// 각 레이블에 맞는 데이터 매핑 (없으면 null 처리하여 여백 유지)
						const taData = labels.map((l) => histData.find((x) => x.ymd.substring(5) === l)?.daily_ta || null);
						const loadData = labels.map((l) => histData.find((x) => x.ymd.substring(5) === l)?.daily_load || null);
						const fcstLoadData = labels.map((l) => fcstData.find((x) => x.ymd.substring(5) === l)?.daily_load || null);

						trendInstance.current = new Chart(trendChartRef.current, {
							type: "bar",
							data: {
								labels: labels,
								datasets: [
									{
										type: "line",
										label: "과거 일 평균 기온(℃)",
										data: taData,
										borderColor: "#ef4444",
										backgroundColor: "#ef4444",
										yAxisID: "yTa",
										tension: 0.3,
										pointRadius: 3,
										borderWidth: 2,
										spanGaps: true,
									},
									{
										type: "bar",
										label: "과거 총 부하량(kW)",
										data: loadData,
										backgroundColor: "rgba(59, 130, 246, 0.7)", // 기존 파란색
										borderRadius: 4,
										yAxisID: "yLoad",
									},
									{
										type: "bar",
										label: "미래 예측 부하량(kW)",
										data: fcstLoadData,
										backgroundColor: "rgba(249, 115, 22, 0.8)", // 이어지는 예측 구간 (주황색)
										borderRadius: 4,
										yAxisID: "yLoad",
									},
								],
							},
							options: {
								responsive: true,
								maintainAspectRatio: false,
								scales: {
									x: { stacked: true }, // x축 겹침 방지 및 자연스러운 연속 배열
									yLoad: { type: "linear", position: "left", stacked: true, title: { display: true, text: "일일 합산 부하량(kW)" } },
									yTa: { type: "linear", position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "기온(℃)" } },
								},
							},
						});
					}
				}, [reportData, viewMode]);

				// 마크다운 생성 함수 (예측 메트릭스 포함)
				const generateMarkdown = () => {
					if (!reportData) return "";
					const stnName = STATIONS.find((s) => s.id === station)?.name || station;
					const now = new Date().toLocaleString("ko-KR");

					let md = `# 기상 및 에너지 부하 종합 예측 리포트\n\n`;
					md += `**작성일시:** ${now}\n`;
					md += `**분석지역:** ${stnName} 관측소\n`;
					md += `**분석기준:** ${startDate} ~ ${endDate}\n\n`;
					md += `---\n\n`;

					md += `## 1. 종합 운영 현황 요약 (Executive Summary)\n`;
					md += `과거 기상 데이터를 바탕으로 단위 표준 건물 기준의 추정 전력 부하를 산출한 결과입니다.\n\n`;
					md += `- **분석 데이터 범위:** ${reportData.summary.total_hours} 시간\n`;
					md += `- **기간 평균 기온:** ${(reportData.summary.avg_ta || 0).toFixed(1)} ℃\n`;
					md += `- **총 추정 전력 부하:** ${Math.round(reportData.summary.total_load).toLocaleString()} kW\n\n`;

					md += `## 2. 데이터 품질 및 예측 모델 성능 (Quality & Performance)\n`;
					md += `KMA API 원천 데이터 자동 정제 내역 및 모델 평가 지표입니다.\n\n`;
					md += `**데이터 정제 현황**\n`;
					reportData.quality.forEach((q) => {
						md += `- ${q.status}: ${q.count}건\n`;
					});
					md += `\n**모델 예측 성능**\n`;
					if (reportData.forecast && reportData.forecast.metrics) {
						md += `- MAE (평균절대오차): ${reportData.forecast.metrics.mae} kW\n`;
						md += `- RMSE (평균제곱근오차): ${reportData.forecast.metrics.rmse} kW\n`;
						md += `- MAPE (오차율): ${reportData.forecast.metrics.mape} %\n\n`;
					}

					md += `## 3. 과거 최대 피크 분석 (Historical Peak)\n`;
					if (reportData.peak) {
						md += `- **발생 일시:** ${reportData.peak.tm}\n`;
						md += `- **최대 부하량:** ${reportData.peak.load_kw} kW\n`;
						md += `- **당시 기온:** ${reportData.peak.ta} ℃\n\n`;
					}

					md += `## 4. 향후 에너지 부하 예측 (Forecast Overview)\n`;
					if (reportData.forecast) {
						md += `종료일(${endDate}) 기준, 향후 ${reportData.forecast.horizon} 구간의 예측 결과입니다.\n\n`;
						md += `- **예측 평균 부하량:** ${reportData.forecast.avg_load} kW\n`;
						md += `- **예상 피크 발생 일시:** ${reportData.forecast.peak_time}\n`;
						md += `- **예상 최대 피크 부하:** ${reportData.forecast.peak_load} kW\n\n`;
					}

					md += `## 5. 결론 및 제언 (Conclusion & Recommendations)\n`;
					md += `데이터 검증이 정상 완료되었습니다. `;
					if (reportData.forecast) {
						md += `예측 시뮬레이션 결과 향후 ${reportData.forecast.horizon} 내 **${reportData.forecast.peak_time} 경 약 ${reportData.forecast.peak_load}kW 수준의 피크 부하** 발생이 전망되므로, 부하 분산(Peak Cut) 전략 수립을 강력히 권장합니다.\n`;
					}

					return md;
				};

				const handleCopyMD = () => {
					const mdText = generateMarkdown();
					navigator.clipboard
						.writeText(mdText)
						.then(() => {
							alert("마크다운이 클립보드에 복사되었습니다.");
						})
						.catch((err) => {
							alert("복사 실패: " + err);
						});
				};

				const handlePrint = () => {
					setViewMode("web");
					setTimeout(() => window.print(), 300);
				};

				return (
					<div className="min-h-screen flex flex-col">
						<div className="flex-1 max-w-[1400px] w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6 flex flex-col lg:flex-row gap-6 items-start">
							{/* ─── 좌측 사이드바 (Z-index 및 모바일 겹침 문제 해결) ─── */}
							<aside className="w-full lg:w-[300px] flex-shrink-0 flex flex-col gap-4 lg:sticky lg:top-24 lg:z-20 no-print">
								<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
									<div className="flex items-center gap-2 border-b border-slate-100 pb-3">
										<span className="w-5 h-5 rounded-md bg-slate-800 text-white flex items-center justify-center text-xs font-bold">
											<Icon name="file-text" className="w-3 h-3" />
										</span>
										<h2 className="font-bold text-slate-900">리포트 조건 설정</h2>
									</div>

									<div>
										<label className="block text-xs font-semibold text-slate-600 mb-1.5">대상 지역</label>
										<select value={station} onChange={(e) => setStation(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none">
											{STATIONS.map((s) => (
												<option key={s.id} value={s.id}>
													{s.name} ({s.id})
												</option>
											))}
										</select>
									</div>

									<div className="grid grid-cols-2 gap-2">
										<div>
											<label className="block text-xs font-semibold text-slate-600 mb-1.5">시작일</label>
											<input type="date" value={startDate} onChange={handleStartChange} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-[12px] font-medium focus:ring-2 focus:ring-brand-500 outline-none" />
										</div>
										<div>
											<label className="block text-xs font-semibold text-slate-600 mb-1.5">종료일</label>
											<input type="date" value={endDate} onChange={handleEndChange} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-[12px] font-medium focus:ring-2 focus:ring-brand-500 outline-none" />
										</div>
									</div>

									<div>
										<label className="block text-xs font-semibold text-slate-600 mb-1.5">포함할 예측 구간 (Horizon)</label>
										<div className="flex bg-slate-100 p-1 rounded-lg text-xs font-semibold text-slate-600">
											{["24h", "48h", "7d"].map((h) => (
												<button key={h} onClick={() => setHorizon(h)} className={`flex-1 py-1.5 rounded-md transition ${horizon === h ? "bg-white text-brand-600 shadow-sm font-bold border border-slate-200" : "hover:text-slate-900"}`}>
													+{h.toUpperCase()}
												</button>
											))}
										</div>
									</div>

									<button type="button" onClick={fetchReport} disabled={loading} className="w-full bg-slate-800 hover:bg-slate-900 text-white rounded-lg px-4 py-3 text-sm font-bold shadow-sm transition disabled:opacity-50 flex items-center justify-center mt-2">
										{loading ? "데이터 분석 중..." : "리포트 데이터 생성"}
									</button>
								</div>

								{/* 뷰 컨트롤 & 액션 버튼 */}
								{reportData && (
									<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-3 space-y-2">
										<div className="flex p-1 bg-slate-100 rounded-xl mb-3">
											<button onClick={() => setViewMode("web")} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${viewMode === "web" ? "bg-white text-brand-700 shadow-sm" : "text-slate-500 hover:text-slate-900"}`}>
												웹 뷰
											</button>
											<button onClick={() => setViewMode("md")} className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${viewMode === "md" ? "bg-white text-brand-700 shadow-sm" : "text-slate-500 hover:text-slate-900"}`}>
												REPORT.md 보기
											</button>
										</div>

										<button type="button" onClick={handleCopyMD} className="w-full bg-slate-50 border border-slate-200 text-slate-700 hover:bg-slate-100 rounded-xl p-3 text-sm font-bold transition flex items-center justify-center gap-2">
											<Icon name="copy" /> MD 클립보드 복사
										</button>
										<button type="button" onClick={handlePrint} className="w-full bg-white border border-brand-200 text-brand-700 hover:bg-brand-50 rounded-xl p-3 text-sm font-bold transition flex items-center justify-center gap-2">
											<Icon name="printer" /> 보고서 인쇄 (PDF 저장)
										</button>
									</div>
								)}
							</aside>

							{/* ─── 우측 메인 (리포트 출력 영역) ─── */}
							<main className="flex-1 w-full min-w-0 bg-white border border-slate-200 shadow-lg p-6 sm:p-10 rounded-xl print-container">
								{error && <div className="p-4 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-sm font-bold no-print">{error}</div>}

								{!reportData && !loading && !error && (
									<div className="py-20 text-center text-slate-500 no-print">
										<Icon name="file-text" className="w-12 h-12 mx-auto mb-4 text-slate-300" />
										좌측에서 기간 및 예측 구간을 선택하고 리포트를 생성해주세요.
									</div>
								)}

								{/* 뷰 모드: 웹 (Web View) */}
								{reportData && viewMode === "web" && (
									<div className="space-y-10 animate-fade-in">
										{/* 리포트 헤더 */}
										<div className="border-b-2 border-slate-800 pb-6 flex justify-between items-end">
											<div>
												<h1 className="text-3xl font-black text-slate-900 mb-2 tracking-tight">종합 기상 예측 및 부하 분석 리포트</h1>
												<p className="text-sm text-slate-500 font-medium">작성일시: {new Date().toLocaleString("ko-KR")}</p>
											</div>
											<div className="text-right">
												<p className="text-sm font-bold text-brand-700 bg-brand-50 px-3 py-1 rounded-lg inline-block">분석 지역: {STATIONS.find((s) => s.id === station)?.name} 관측소</p>
												<p className="text-sm font-semibold text-slate-700 mt-2">
													기준 구간: {startDate} ~ {endDate}
												</p>
											</div>
										</div>

										{/* 1. 핵심 성과 지표 (Executive Summary) */}
										<div className="print-break-inside-avoid">
											<h2 className="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
												<div className="w-1.5 h-4 bg-brand-500 rounded"></div>
												1. 과거 종합 운영 현황 (Historical Summary)
											</h2>
											<p className="text-sm text-slate-600 mb-4 leading-relaxed">해당 기간 동안 수집된 기상 데이터를 바탕으로 분석된 과거 데이터 요약 통계입니다.</p>
											<div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
												<div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
													<p className="text-xs text-slate-500 mb-1 font-medium">분석 데이터 범위</p>
													<p className="text-2xl font-bold text-slate-900">
														{reportData.summary.total_hours} <span className="text-sm font-normal text-slate-400">시간</span>
													</p>
												</div>
												<div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
													<p className="text-xs text-slate-500 mb-1 font-medium">기간 평균 기온</p>
													<p className="text-2xl font-bold text-rose-600">
														{(reportData.summary.avg_ta || 0).toFixed(1)} <span className="text-sm font-normal text-rose-400">℃</span>
													</p>
												</div>
												<div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
													<p className="text-xs text-slate-500 mb-1 font-medium">누적 냉난방도일</p>
													<p className="text-2xl font-bold text-brand-600">
														{(reportData.summary.total_cdd + reportData.summary.total_hdd).toFixed(1)} <span className="text-sm font-normal text-brand-400">지수</span>
													</p>
												</div>
												<div className="bg-slate-50 p-4 rounded-xl border border-slate-100 border-l-4 border-l-slate-800">
													<p className="text-xs text-slate-500 mb-1 font-medium">총 추정 전력 부하</p>
													<p className="text-2xl font-bold text-slate-900">
														{Math.round(reportData.summary.total_load).toLocaleString()} <span className="text-sm font-normal text-slate-400">kW</span>
													</p>
												</div>
											</div>
										</div>

										{/* 2. 데이터 품질 현황 및 모델 예측 성능 */}
										<div className="grid grid-cols-1 md:grid-cols-2 gap-6 print-break-inside-avoid">
											{/* 데이터 정제 현황 */}
											<div className="border border-slate-200 rounded-xl p-5 bg-white flex flex-col">
												<h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
													<Icon name="shield-check" className="text-emerald-500" /> 데이터 자동 정제(Audit) 내역
												</h2>
												<p className="text-xs text-slate-500 mb-3 leading-relaxed flex-1">API로부터 수집된 원천 데이터의 결측치 및 이상치를 시스템이 자동 보정한 통계 결과입니다.</p>
												<ul className="space-y-2 mt-auto">
													{reportData.quality.map((q, idx) => (
														<li key={idx} className="text-sm flex justify-between items-center bg-slate-50 px-3 py-2.5 rounded-lg border border-slate-100">
															<span className="text-slate-600 truncate mr-2 font-medium">• {q.status}</span>
															<span className="font-bold text-slate-800">{q.count}건</span>
														</li>
													))}
												</ul>
											</div>

											{/* 모델 예측 성능 */}
											{reportData.forecast && (
												<div className="border border-slate-200 rounded-xl p-5 bg-white flex flex-col">
													<h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
														<Icon name="activity" className="text-blue-500" /> 예측 모델 성능 평가지표
													</h2>
													<p className="text-xs text-slate-500 mb-3 leading-relaxed flex-1">과거 구간 백테스팅을 통해 현재 적용된 시계열 알고리즘의 평균 오차와 안정성을 평가한 수치입니다.</p>
													<div className="grid grid-cols-1 gap-2 mt-auto">
														<div className="flex justify-between items-center bg-slate-50 px-3 py-2.5 rounded-lg border border-slate-100">
															<span className="text-slate-600 text-sm font-medium">평균 절대 오차 (MAE)</span>
															<span className="font-bold text-slate-800">{reportData.forecast.metrics.mae} kW</span>
														</div>
														<div className="flex justify-between items-center bg-slate-50 px-3 py-2.5 rounded-lg border border-slate-100">
															<span className="text-slate-600 text-sm font-medium">평균 제곱근 오차 (RMSE)</span>
															<span className="font-bold text-slate-800">{reportData.forecast.metrics.rmse} kW</span>
														</div>
														<div className="flex justify-between items-center bg-brand-50 px-3 py-2.5 rounded-lg border border-brand-100">
															<span className="text-brand-800 text-sm font-bold">오차율 (MAPE)</span>
															<span className="font-black text-brand-600">{reportData.forecast.metrics.mape} %</span>
														</div>
													</div>
												</div>
											)}
										</div>

										{/* 3. 피크 & 예측 요약 */}
										<div className="grid grid-cols-1 md:grid-cols-2 gap-8 print-break-inside-avoid">
											{/* 과거 피크 부하 분석 */}
											<div className="flex flex-col">
												<h2 className="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
													<div className="w-1.5 h-4 bg-slate-500 rounded"></div>
													3. 과거 최대 피크 분석 (Historical Peak)
												</h2>
												<div className="border border-slate-200 rounded-xl p-5 bg-slate-50 flex-1 mt-2">
													{reportData.peak ? (
														<div className="space-y-4">
															<div className="border-b border-slate-200 pb-3">
																<p className="text-xs font-bold text-slate-500 mb-1">피크 발생 일시</p>
																<p className="text-xl font-black text-slate-800">{reportData.peak.tm}</p>
															</div>
															<div className="grid grid-cols-2 gap-3">
																<div>
																	<p className="text-xs text-slate-400">최대 부하량</p>
																	<p className="font-bold text-slate-800">{reportData.peak.load_kw} kW</p>
																</div>
																<div>
																	<p className="text-xs text-slate-400">당시 기온</p>
																	<p className="font-bold text-rose-600">{reportData.peak.ta} ℃</p>
																</div>
																<div>
																	<p className="text-xs text-slate-400">불쾌지수(DI)</p>
																	<p className="font-bold text-slate-800">{reportData.peak.di}</p>
																</div>
																<div>
																	<p className="text-xs text-slate-400">당시 일조량</p>
																	<p className="font-bold text-slate-800">{reportData.peak.ss} hr</p>
																</div>
															</div>
														</div>
													) : (
														<p className="text-sm text-slate-400">피크 데이터가 없습니다.</p>
													)}
												</div>
											</div>

											{/* 향후 미래 예측 */}
											<div className="flex flex-col">
												<h2 className="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
													<div className="w-1.5 h-4 bg-rose-500 rounded"></div>
													4. 향후 에너지 부하 예측 (Forecast)
												</h2>
												<div className="border border-rose-200 rounded-xl p-5 bg-rose-50 flex-1 mt-2">
													{reportData.forecast ? (
														<div className="space-y-4">
															<div className="border-b border-rose-200 pb-3">
																<p className="text-xs font-bold text-rose-500 mb-1">예상 최대 피크 일시 (+{reportData.forecast.horizon})</p>
																<p className="text-xl font-black text-rose-900">{reportData.forecast.peak_time}</p>
															</div>
															<div className="grid grid-cols-1 gap-3">
																<div className="bg-white p-3 rounded-lg border border-rose-100 flex justify-between items-center">
																	<p className="text-xs font-bold text-slate-500">예상 최대 피크 부하</p>
																	<p className="font-black text-rose-600 text-lg">{reportData.forecast.peak_load} kW</p>
																</div>
																<div className="bg-white p-3 rounded-lg border border-rose-100 flex justify-between items-center">
																	<p className="text-xs font-bold text-slate-500">예측 구간 내 평균 부하</p>
																	<p className="font-bold text-slate-800">{reportData.forecast.avg_load} kW</p>
																</div>
															</div>
														</div>
													) : (
														<p className="text-sm text-slate-400">예측 데이터가 없습니다.</p>
													)}
												</div>
											</div>
										</div>

										{/* 5. 일별 트렌드 추세 차트 (연속 시각화 적용) */}
										<div className="print-break-inside-avoid">
											<h2 className="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
												<div className="w-1.5 h-4 bg-blue-500 rounded"></div>
												5. 일별 에너지 부하 예측 흐름도
											</h2>
											<p className="text-sm text-slate-600 mb-4 leading-relaxed">과거 실적(파란색)과 향후 예측 구간(주황색)의 일일 총합 전력 부하량이 연속적으로 이어지는 시계열 차트입니다.</p>
											<div className="border border-slate-200 rounded-xl p-5">
												<div className="h-72 w-full">
													<canvas ref={trendChartRef}></canvas>
												</div>
											</div>
										</div>

										{/* 6. 결론 및 제언 */}
										<div className="print-break-inside-avoid bg-slate-800 text-white rounded-xl p-6 shadow-md mt-8">
											<h2 className="text-lg font-bold text-brand-300 mb-3 flex items-center gap-2">
												<Icon name="check-circle" className="text-brand-300" />
												6. 종합 결론 및 제언 (Recommendations)
											</h2>
											<div className="text-sm text-slate-300 leading-relaxed space-y-4">
												<p>수집된 전체 기간의 데이터를 검증(Audit)한 결과 파이프라인의 자동 정제가 정상 수행되었으며, 분석의 신뢰성을 확보하였습니다.</p>
												{reportData.forecast && reportData.peak && (
													<p className="bg-slate-700/50 p-4 rounded-lg border border-slate-600">
														과거 피크 기록({reportData.peak.load_kw}kW) 분석과 더불어 예측 모델 시뮬레이션을 수행한 결과, 향후 <b>{reportData.forecast.horizon}</b> 내에
														<span className="text-rose-400 font-bold">
															{" "}
															{reportData.forecast.peak_time} 경 약 {reportData.forecast.peak_load}kW 수준의 최대 피크 부하 발생이 전망
														</span>
														됩니다.
														<br />
														<br />
														해당 시간대에 전력 소모가 집중되지 않도록, 1~2시간 사전 공조 가동 등의 적극적인 <b>부하 분산(Peak Cut) 전략 수립을 강력히 권장</b>합니다.
													</p>
												)}
											</div>
										</div>
									</div>
								)}

								{/* 뷰 모드: 마크다운 (MD View) */}
								{reportData && viewMode === "md" && (
									<div className="animate-fade-in no-print h-full flex flex-col">
										<div className="bg-[#1e1e1e] rounded-xl p-5 flex-1 min-h-[600px] overflow-auto border border-slate-800 shadow-inner">
											<pre className="text-[13px] text-green-400 font-mono whitespace-pre-wrap leading-relaxed">{generateMarkdown()}</pre>
										</div>
									</div>
								)}
							</main>
						</div>
					</div>
				);
			}

			ReactDOM.createRoot(document.getElementById("root")).render(<ReportPage />);
		</script>
	</body>
</html>
