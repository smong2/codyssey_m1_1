- **원인 (Why)**: 지표면 및 건물 축열 효과로 인한 열 방출 지연 현상(Thermal Lag).
- **행동 (Action)**: 12:30~14:30 집중 냉방 후 15:00부터 송풍/환기 모드로 전환하여 피크 시간대(14~16시) 전력 사용량을 분산.
