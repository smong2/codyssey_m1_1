<!doctype html>
<html lang="ko" class="notranslate" translate="no">
	<head>
		<meta charset="UTF-8" />
		<meta name="google" content="notranslate" />
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>탐색적 데이터 분석 (EDA)</title>

		<script src="https://cdn.tailwindcss.com"></script>
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
		<style>
			body {
				font-family:
					"Pretendard",
					-apple-system,
					sans-serif;
			}
			::-webkit-scrollbar {
				width: 6px;
				height: 6px;
			}
			::-webkit-scrollbar-thumb {
				background: #cbd5e1;
				border-radius: 3px;
			}
		</style>

		<script>
			tailwind.config = { theme: { extend: { colors: { brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" } } } } };
		</script>
	</head>
	<body class="bg-slate-50 text-slate-800 p-4 sm:p-6 lg:p-8 notranslate" translate="no">
		<div id="root"></div>

		<script type="text/babel">
			const { useState, useEffect, useRef } = React;

			const STATIONS = [
				{ id: "108", name: "서울" },
				{ id: "112", name: "인천" },
				{ id: "159", name: "부산" },
				{ id: "143", name: "대구" },
				{ id: "156", name: "광주" },
				{ id: "133", name: "대전" },
			];

			function Icon({ name, className = "w-4 h-4" }) {
				if (name === "bar-chart")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 20V10M12 20V4M6 20v-6" />
						</svg>
					);
				if (name === "search")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
						</svg>
					);
				if (name === "info")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<circle cx="12" cy="12" r="10" strokeWidth="2" />
							<line x1="12" y1="16" x2="12" y2="12" strokeWidth="2" />
							<line x1="12" y1="8" x2="12.01" y2="8" strokeWidth="2" />
						</svg>
					);
				return null;
			}

			function EdaApp() {
				const [station, setStation] = useState("108");
				const [startDate, setStartDate] = useState("2026-08-20");
				const [endDate, setEndDate] = useState("2026-08-27");

				const [loading, setLoading] = useState(false);
				const [data, setData] = useState({ hourly: [], daily: [] });
				const [error, setError] = useState(null);

				const chartTrend = useRef(null);
				const chartScatter = useRef(null);
				const chartBar = useRef(null);

				const fetchEdaData = async () => {
					setLoading(true);
					setError(null);
					try {
						const res = await fetch(`/api/weather/eda?stn=${station}&startDate=${startDate}&endDate=${endDate}`);
						if (!res.ok) throw new Error("데이터를 불러오지 못했습니다.");
						const result = await res.json();
						setData(result);

						if (result.hourly.length === 0) {
							setError("해당 기간에 수집된 데이터가 없습니다. 먼저 [데이터 수집] 메뉴에서 데이터를 적재해 주세요.");
						}
					} catch (err) {
						setError(err.message);
					} finally {
						setLoading(false);
					}
				};

				useEffect(() => {
					if (data.hourly.length === 0) return;

					// 1. 추세 차트
					const ctxTrend = document.getElementById("chartTrend").getContext("2d");
					if (chartTrend.current) chartTrend.current.destroy();
					chartTrend.current = new Chart(ctxTrend, {
						type: "line",
						data: {
							labels: data.hourly.map((d) => d.tm.slice(5, 13)),
							datasets: [
								{
									label: "기온 (℃)",
									data: data.hourly.map((d) => d.ta),
									borderColor: "#ef4444",
									backgroundColor: "#ef4444",
									yAxisID: "y",
									tension: 0.3,
									pointRadius: 0,
									borderWidth: 2,
								},
								{
									label: "추정 부하 (kW)",
									data: data.hourly.map((d) => d.load_kw),
									type: "bar",
									backgroundColor: "rgba(59, 130, 246, 0.4)",
									yAxisID: "y1",
								},
							],
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							interaction: { mode: "index", intersect: false },
							scales: {
								y: { type: "linear", display: true, position: "left", title: { display: true, text: "기온(℃)" } },
								y1: { type: "linear", display: true, position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "부하(kW)" } },
							},
						},
					});

					// 2. 산점도 차트
					const ctxScatter = document.getElementById("chartScatter").getContext("2d");
					if (chartScatter.current) chartScatter.current.destroy();
					chartScatter.current = new Chart(ctxScatter, {
						type: "scatter",
						data: {
							datasets: [
								{
									label: "기온 대비 부하량",
									data: data.hourly.map((d) => ({ x: d.ta, y: d.load_kw })),
									backgroundColor: "rgba(99, 102, 241, 0.6)",
									borderColor: "rgba(99, 102, 241, 1)",
								},
							],
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							scales: {
								x: { title: { display: true, text: "기온 (℃)" } },
								y: { title: { display: true, text: "추정 부하 (kW)" } },
							},
						},
					});

					// 3. 누적 바 차트
					const ctxBar = document.getElementById("chartBar").getContext("2d");
					if (chartBar.current) chartBar.current.destroy();
					chartBar.current = new Chart(ctxBar, {
						type: "bar",
						data: {
							labels: data.daily.map((d) => d.ymd.slice(5)),
							datasets: [
								{ label: "냉방도일(CDD)", data: data.daily.map((d) => d.sum_cdd), backgroundColor: "#3b82f6" },
								{ label: "난방도일(HDD)", data: data.daily.map((d) => d.sum_hdd), backgroundColor: "#f97316" },
							],
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							scales: { x: { stacked: true }, y: { stacked: true, title: { display: true, text: "지수 합산" } } },
						},
					});
				}, [data]);

				const avgTemp = data.daily.length > 0 ? (data.daily.reduce((acc, cur) => acc + cur.avg_ta, 0) / data.daily.length).toFixed(1) : 0;
				const maxLoad = data.hourly.length > 0 ? Math.max(...data.hourly.map((d) => d.load_kw)).toFixed(1) : 0;
				const totalCDD = data.daily.length > 0 ? data.daily.reduce((acc, cur) => acc + cur.sum_cdd, 0).toFixed(1) : 0;
				const totalHDD = data.daily.length > 0 ? data.daily.reduce((acc, cur) => acc + cur.sum_hdd, 0).toFixed(1) : 0;

				return (
					<div className="max-w-6xl mx-auto space-y-6 pb-12">
						{/* Header */}
						<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
							<div>
								<h1 className="text-xl font-bold text-slate-900">탐색적 데이터 분석 (EDA)</h1>
								<p className="text-xs sm:text-sm text-slate-500 mt-1">DB에 적재된 기상 변수와 에너지 부하량 간의 상관관계를 시각화하여 예측 모델의 유효성을 검증합니다.</p>
							</div>
							<a href="/data.html" className="text-sm font-bold text-brand-600 hover:text-brand-700 bg-brand-50 px-4 py-2 rounded-lg transition">
								수집 페이지로 가기
							</a>
						</div>

						{/* Filter Form */}
						<section className="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
							<div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
								<div>
									<label className="block text-xs font-semibold text-slate-600 mb-1.5">분석 대상 지역</label>
									<select value={station} onChange={(e) => setStation(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none">
										{STATIONS.map((s) => (
											<option key={s.id} value={s.id}>
												{s.name} ({s.id})
											</option>
										))}
									</select>
								</div>
								<div>
									<label className="block text-xs font-semibold text-slate-600 mb-1.5">분석 시작일</label>
									<input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none" />
								</div>
								<div>
									<label className="block text-xs font-semibold text-slate-600 mb-1.5">분석 종료일</label>
									<input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none" />
								</div>
								<div className="flex items-end">
									<button type="button" onClick={fetchEdaData} disabled={loading} className="w-full bg-slate-800 hover:bg-slate-900 text-white rounded-xl px-4 py-2.5 text-sm font-bold shadow-sm transition disabled:opacity-50 flex items-center justify-center gap-2">
										{loading ? (
											"분석 중..."
										) : (
											<>
												<Icon name="search" />
												데이터 시각화
											</>
										)}
									</button>
								</div>
							</div>
						</section>

						{error && <div className="p-4 bg-rose-50 border border-rose-200 rounded-2xl text-rose-800 text-sm font-bold">{error}</div>}

						{/* Dashboards */}
						{data.hourly.length > 0 && !loading && !error && (
							<div className="space-y-6 animate-fade-in">
								{/* EDA Overview Guide */}
								<div className="bg-blue-50/70 border border-blue-100 p-5 rounded-2xl flex gap-3 text-sm">
									<Icon name="info" className="text-blue-600 mt-0.5 w-5 h-5 flex-shrink-0" />
									<div className="text-slate-700 leading-relaxed">
										<p className="font-bold text-blue-900 mb-1">분석(EDA) 및 피처(Feature) 유효성 검증 가이드</p>
										<p className="text-xs">
											본 대시보드는 정제된 기상청 관측 데이터가 <b>실제 에너지 전력 부하 예측 모델링에 적합한지 검증</b>하기 위해 구성되었습니다. 단순한 시계열 흐름뿐만 아니라 기온(독립변수)과 파생 지표(냉/난방도일)가 추정 부하(종속변수)에 미치는 영향을 진단하여 예측 모델 피처의 타당성을 입증합니다.
										</p>
									</div>
								</div>

								{/* Summary KPIs */}
								<section className="grid grid-cols-2 md:grid-cols-4 gap-4">
									<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 border-l-4 border-l-rose-500">
										<span className="text-xs font-medium text-slate-500">기간 내 평균 기온</span>
										<p className="text-2xl font-bold text-slate-900 mt-1">
											{avgTemp} <span className="text-sm font-normal text-slate-400">℃</span>
										</p>
									</div>
									<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 border-l-4 border-l-brand-500">
										<span className="text-xs font-medium text-slate-500">누적 냉방도일 (CDD 합산)</span>
										<p className="text-2xl font-bold text-slate-900 mt-1">{totalCDD}</p>
									</div>
									<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 border-l-4 border-l-orange-500">
										<span className="text-xs font-medium text-slate-500">누적 난방도일 (HDD 합산)</span>
										<p className="text-2xl font-bold text-slate-900 mt-1">{totalHDD}</p>
									</div>
									<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 border-l-4 border-l-slate-800">
										<span className="text-xs font-medium text-slate-500">기간 내 최대 추정 부하</span>
										<p className="text-2xl font-bold text-slate-900 mt-1">
											{maxLoad} <span className="text-sm font-normal text-slate-400">kW</span>
										</p>
									</div>
								</section>

								{/* Charts Grid */}
								<div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
									{/* 1. 기온 및 부하 추세 */}
									<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm col-span-1 lg:col-span-2">
										<h3 className="text-sm font-bold text-slate-900 mb-1 flex items-center gap-2">
											<Icon name="bar-chart" /> 기온 변화에 따른 전력 부하 추세 (Time Series)
										</h3>
										<p className="text-[11px] sm:text-xs text-slate-500 mb-4">시간 흐름에 따른 기온과 전력 부하의 증감 패턴을 겹쳐서 확인합니다. 주/야간 일교차 등 시간적 주기가 에너지 수요에 미치는 직접적인 동기화(Synchronization) 현상을 파악할 수 있습니다.</p>
										<div className="relative h-80 w-full">
											<canvas id="chartTrend"></canvas>
										</div>
									</div>

									{/* 2. 산점도 */}
									<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
										<h3 className="text-sm font-bold text-slate-900 mb-1">기온 vs 전력 부하량 상관관계 (Scatter Plot)</h3>
										<p className="text-[11px] sm:text-xs text-slate-500 mb-4">냉·난방 가동으로 인해 양 극단 온도에서 부하가 상승하는 비선형(U자/V자형) 상관구조가 나타나는지 진단하여 선형 회귀 외의 복합 예측 모델 도입 필요성을 검토합니다.</p>
										<div className="relative h-72 w-full">
											<canvas id="chartScatter"></canvas>
										</div>
									</div>

									{/* 3. 누적 바 차트 */}
									<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
										<h3 className="text-sm font-bold text-slate-900 mb-1">일별 냉/난방도일 (Degree Days) 에너지 임계 분포</h3>
										<p className="text-[11px] sm:text-xs text-slate-500 mb-4">냉방 24℃, 난방 18℃ 기준선을 벗어난 온도를 누적한 지수입니다. 이 파생 변수는 절대적 기온 수치보다 물리적 에너지 소요량을 훨씬 직관적으로 설명(Feature Importance)합니다.</p>
										<div className="relative h-72 w-full">
											<canvas id="chartBar"></canvas>
										</div>
									</div>
								</div>
							</div>
						)}
					</div>
				);
			}

			ReactDOM.createRoot(document.getElementById("root")).render(<EdaApp />);
		</script>
	</body>
</html>
