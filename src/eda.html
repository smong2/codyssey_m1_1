<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>탐색적 데이터 분석 (EDA) | WeatherLoad</title>

		<!-- Tailwind CSS CDN -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- React & ReactDOM CDN -->
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<!-- Babel (JSX 변환) -->
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
		<!-- Lucide Icons -->
		<script src="https://unpkg.com/lucide@latest"></script>
		<!-- Chart.js CDN -->
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<!-- Pretendard 폰트 -->
		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

		<style>
			body {
				font-family:
					"Pretendard",
					-apple-system,
					sans-serif;
			}
			::-webkit-scrollbar {
				width: 6px;
				height: 6px;
			}
			::-webkit-scrollbar-thumb {
				background: #cbd5e1;
				border-radius: 3px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
		</style>

		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							brand: {
								50: "#eff6ff",
								100: "#dbeafe",
								500: "#3b82f6",
								600: "#2563eb",
								700: "#1d4ed8",
								900: "#1e3a8a",
							},
						},
					},
				},
			};
		</script>
	</head>
	<body class="bg-slate-50 text-slate-800 p-4 sm:p-6 lg:p-8">
		<div id="root"></div>

		<script type="text/babel">
			const { useState, useEffect, useRef } = React;

			// 변수별 기술 통계량 (Descriptive Statistics)
			const STAT_TABLE = [
				{ name: "기온 (℃)", mean: 24.6, std: 6.8, min: -8.4, p50: 25.1, max: 36.2, skew: "-0.18 (좌경사)" },
				{ name: "상대습도 (%)", mean: 64.2, std: 14.5, min: 22.0, p50: 65.0, max: 98.0, skew: "+0.05 (대칭)" },
				{ name: "일조시간 (hr)", mean: 0.42, std: 0.38, min: 0.0, p50: 0.3, max: 1.0, skew: "+0.52 (우경사)" },
				{ name: "불쾌지수 (DI)", mean: 71.8, std: 8.9, min: 42.1, p50: 73.4, max: 84.6, skew: "-0.32 (좌경사)" },
				{ name: "냉방도일 (CDD)", mean: 3.42, std: 2.85, min: 0.0, p50: 2.8, max: 12.2, skew: "+1.12 (집중)" },
				{ name: "난방도일 (HDD)", mean: 2.15, std: 3.1, min: 0.0, p50: 0.0, max: 18.5, skew: "+1.85 (집중)" },
			];

			// 상관계수 매트릭스 (Correlation Heatmap Data)
			const CORRELATION_DATA = [
				{ var: "기온", temp: 1.0, humidity: -0.28, sunshine: 0.54, di: 0.94, load: 0.88 },
				{ var: "상대습도", temp: -0.28, humidity: 1.0, sunshine: -0.58, di: 0.08, load: -0.15 },
				{ var: "일조시간", temp: 0.54, humidity: -0.58, sunshine: 1.0, di: 0.42, load: 0.62 },
				{ var: "불쾌지수(DI)", temp: 0.94, humidity: 0.08, sunshine: 0.42, di: 1.0, load: 0.89 },
				{ var: "부하지표(Load)", temp: 0.88, humidity: -0.15, sunshine: 0.62, di: 0.89, load: 1.0 },
			];

			function EdaPage() {
				const [filterSeason, setFilterSeason] = useState("all");
				const [activeSubTab, setActiveSubTab] = useState("threshold");

				const thresholdChartRef = useRef(null);
				const diurnalChartRef = useRef(null);
				const sunshineChartRef = useRef(null);

				const thresholdInstance = useRef(null);
				const diurnalInstance = useRef(null);
				const sunshineInstance = useRef(null);

				useEffect(() => {
					if (window.lucide) window.lucide.createIcons();

					// ── Chart 1: 기온 구간별 냉·난방 부하 임계점 (U-Curve) ──
					if (thresholdChartRef.current) {
						if (thresholdInstance.current) thresholdInstance.current.destroy();
						const ctx1 = thresholdChartRef.current.getContext("2d");

						thresholdInstance.current = new Chart(ctx1, {
							type: "line",
							data: {
								labels: ["-5℃ 이하", "-5~0℃", "0~5℃", "5~10℃", "10~15℃", "15~20℃(쾌적)", "20~24℃", "24~28℃", "28~32℃", "32℃ 이상"],
								datasets: [
									{
										label: "총 에너지 부하 지수 (kW)",
										data: [8.8, 6.9, 4.8, 3.2, 1.8, 1.1, 1.9, 4.4, 7.8, 10.5],
										borderColor: "#2563eb",
										backgroundColor: "rgba(37, 99, 235, 0.1)",
										fill: true,
										tension: 0.3,
										pointRadius: 5,
										pointBackgroundColor: "#2563eb",
									},
									{
										label: "임계 경계선 (기준 24℃/18℃)",
										data: [null, null, null, null, null, 1.1, null, null, null, null],
										pointRadius: 8,
										pointBackgroundColor: "#10b981",
										showLine: false,
									},
								],
							},
							options: {
								responsive: true,
								maintainAspectRatio: false,
								plugins: {
									legend: { position: "top", align: "end" },
									tooltip: {
										callbacks: {
											afterBody: (context) => {
												const idx = context[0].dataIndex;
												if (idx >= 7) return "🔥 냉방 급증 구간 (CDD 영향)";
												if (idx <= 3) return "❄️ 난방 급증 구간 (HDD 영향)";
												return "🌱 베이스라인 쾌적 구간";
											},
										},
									},
								},
								scales: {
									y: {
										beginAtZero: true,
										title: { display: true, text: "평균 부하 지수 (kW)" },
										grid: { color: "#f1f5f9" },
									},
									x: {
										grid: { display: false },
									},
								},
							},
						});
					}

					// ── Chart 2: 24시간 일주기(Diurnal) 패턴 (기온 vs 불쾌지수) ──
					if (diurnalChartRef.current) {
						if (diurnalInstance.current) diurnalInstance.current.destroy();
						const ctx2 = diurnalChartRef.current.getContext("2d");

						const hours = Array.from({ length: 24 }, (_, i) => `${i}시`);
						const temp24 = [22, 21.5, 21.1, 20.8, 20.5, 21.0, 22.4, 24.5, 27.0, 29.1, 30.5, 31.8, 32.4, 32.8, 32.2, 31.0, 29.5, 27.8, 26.2, 25.0, 24.1, 23.5, 22.9, 22.4];
						const di24 = [68, 67.5, 67.0, 66.8, 66.5, 67.2, 69.5, 72.8, 76.2, 78.8, 80.5, 82.1, 83.0, 83.4, 82.5, 80.9, 78.8, 76.2, 74.0, 72.5, 71.0, 70.1, 69.2, 68.5];

						diurnalInstance.current = new Chart(ctx2, {
							type: "line",
							data: {
								labels: hours,
								datasets: [
									{
										label: "기온 (℃)",
										data: temp24,
										borderColor: "#ef4444",
										yAxisID: "yTemp",
										tension: 0.35,
										pointRadius: 2,
									},
									{
										label: "불쾌지수 (DI)",
										data: di24,
										borderColor: "#8b5cf6",
										yAxisID: "yDi",
										tension: 0.35,
										borderDash: [3, 3],
										pointRadius: 2,
									},
								],
							},
							options: {
								responsive: true,
								maintainAspectRatio: false,
								interaction: { mode: "index", intersect: false },
								plugins: {
									legend: { position: "top", align: "end" },
								},
								scales: {
									yTemp: {
										type: "linear",
										position: "left",
										title: { display: true, text: "기온 (℃)" },
										grid: { color: "#f1f5f9" },
									},
									yDi: {
										type: "linear",
										position: "right",
										title: { display: true, text: "불쾌지수" },
										grid: { display: false },
										min: 60,
										max: 90,
									},
									x: {
										grid: { display: false },
									},
								},
							},
						});
					}

					// ── Chart 3: 일조량 유무에 따른 냉방 부하 차이 (Box/Bar) ──
					if (sunshineChartRef.current) {
						if (sunshineInstance.current) sunshineInstance.current.destroy();
						const ctx3 = sunshineChartRef.current.getContext("2d");

						sunshineInstance.current = new Chart(ctx3, {
							type: "bar",
							data: {
								labels: ["오전(09~12시)", "정오·오후(12~15시)", "늦은오후(15~18시)"],
								datasets: [
									{
										label: "맑음 (일조 > 0.6hr)",
										data: [5.2, 8.9, 7.1],
										backgroundColor: "#f59e0b",
										borderRadius: 6,
									},
									{
										label: "흐림/우천 (일조 < 0.2hr)",
										data: [3.4, 5.8, 4.9],
										backgroundColor: "#94a3b8",
										borderRadius: 6,
									},
								],
							},
							options: {
								responsive: true,
								maintainAspectRatio: false,
								plugins: {
									legend: { position: "top", align: "end" },
								},
								scales: {
									y: {
										beginAtZero: true,
										title: { display: true, text: "평균 냉방 부하 지수" },
										grid: { color: "#f1f5f9" },
									},
									x: { grid: { display: false } },
								},
							},
						});
					}

					return () => {
						if (thresholdInstance.current) thresholdInstance.current.destroy();
						if (diurnalInstance.current) diurnalInstance.current.destroy();
						if (sunshineInstance.current) sunshineInstance.current.destroy();
					};
				}, [filterSeason]);

				const getCorrBg = (val) => {
					if (val === 1.0) return "bg-brand-500 text-white font-bold";
					if (val >= 0.7) return "bg-red-100 text-red-800 font-semibold";
					if (val >= 0.4) return "bg-orange-100 text-orange-800";
					if (val <= -0.4) return "bg-blue-100 text-blue-800";
					return "bg-slate-50 text-slate-600";
				};

				return (
					<div className="max-w-7xl mx-auto space-y-6">
						{/* 헤더 바 */}
						<div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
							<div>
								<h1 className="text-xl font-bold text-slate-900">탐색적 데이터 분석 (EDA)</h1>
								<p className="text-xs sm:text-sm text-slate-500 mt-0.5">기상 인자 간의 다차원 상관성 및 에너지 부하 발생 패턴 심층 분석</p>
							</div>

							<div className="flex items-center gap-2">
								<span className="text-xs text-slate-500 font-medium">계절 필터:</span>
								<select value={filterSeason} onChange={(e) => setFilterSeason(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brand-500 outline-none">
									<option value="all">전체 기간 (4계절)</option>
									<option value="summer">여름철 (6~8월)</option>
									<option value="winter">겨울철 (12~2월)</option>
									<option value="transition">간절기 (봄/가을)</option>
								</select>
							</div>
						</div>

						{/* ── 1. 핵심 질문별 EDA 시각화 차트 그리드 ── */}
						<div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
							{/* 차트 1: 부하 임계점 (U자형 곡선) */}
							<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
								<div className="flex justify-between items-start mb-3">
									<div>
										<div className="flex items-center gap-2">
											<span className="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700">질문 1</span>
											<h3 className="font-bold text-slate-900 text-base">기온 구간별 부하 임계점 분석</h3>
										</div>
										<p className="text-xs text-slate-400 mt-0.5">기온 변화에 따른 냉·난방 부하의 비선형 U자형 전환점</p>
									</div>
								</div>
								<div className="h-64 w-full">
									<canvas ref={thresholdChartRef}></canvas>
								</div>
								<div className="mt-3 p-3 bg-slate-50 rounded-xl text-xs text-slate-600 flex items-start gap-2">
									<i data-lucide="info" className="w-4 h-4 text-brand-600 mt-0.5 flex-shrink-0"></i>
									<span>
										<b>임계점 관찰:</b> 18℃~22℃ 구간에서 부하가 최소(베이스라인)를 유지하며, <b>28℃ 초과 시</b> 기울기가 2.4배 급증합니다.
									</span>
								</div>
							</div>

							{/* 차트 2: 24시간 일주기 패턴 */}
							<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
								<div className="flex justify-between items-start mb-3">
									<div>
										<div className="flex items-center gap-2">
											<span className="text-xs font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-700">질문 2</span>
											<h3 className="font-bold text-slate-900 text-base">24시간 일주기 기온-불쾌지수 동조화</h3>
										</div>
										<p className="text-xs text-slate-400 mt-0.5">시간대별 기온 상승 및 체감 불쾌지수 피크 시점 추적</p>
									</div>
								</div>
								<div className="h-64 w-full">
									<canvas ref={diurnalChartRef}></canvas>
								</div>
								<div className="mt-3 p-3 bg-slate-50 rounded-xl text-xs text-slate-600 flex items-start gap-2">
									<i data-lucide="info" className="w-4 h-4 text-purple-600 mt-0.5 flex-shrink-0"></i>
									<span>
										<b>시간대 관찰:</b> 13:00~15:00에 불쾌지수 83.4(매우 높음)로 정점을 찍으며, 기온 하강 후에도 18시까지 고부하가 지속됩니다.
									</span>
								</div>
							</div>

							{/* 차트 3: 일조량에 따른 부하 차이 */}
							<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
								<div className="flex justify-between items-start mb-3">
									<div>
										<div className="flex items-center gap-2">
											<span className="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-700">질문 3</span>
											<h3 className="font-bold text-slate-900 text-base">일조량 유무에 따른 냉방 부하 격차</h3>
										</div>
										<p className="text-xs text-slate-400 mt-0.5">맑은 날(일조 지속)과 흐린 날의 동일 기온 대비 부하량 비교</p>
									</div>
								</div>
								<div className="h-64 w-full">
									<canvas ref={sunshineChartRef}></canvas>
								</div>
								<div className="mt-3 p-3 bg-slate-50 rounded-xl text-xs text-slate-600 flex items-start gap-2">
									<i data-lucide="info" className="w-4 h-4 text-amber-600 mt-0.5 flex-shrink-0"></i>
									<span>
										<b>일조 영향 관찰:</b> 정오 기준 맑은 날은 흐린 날 대비 일사열 축적으로 냉방 부하가 약 <b>53.4% 증가</b>합니다.
									</span>
								</div>
							</div>

							{/* 차트 4: 변수 간 상관계수 히트맵 표 */}
							<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
								<div>
									<div className="flex justify-between items-start mb-3">
										<div>
											<div className="flex items-center gap-2">
												<span className="text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">상관성</span>
												<h3 className="font-bold text-slate-900 text-base">기상 변수 간 상관계수 매트릭스</h3>
											</div>
											<p className="text-xs text-slate-400 mt-0.5">피어슨 상관계수(Pearson Correlation r)</p>
										</div>
									</div>

									<div className="overflow-x-auto mt-2">
										<table className="w-full text-xs text-center border-collapse">
											<thead>
												<tr className="border-b border-slate-200 text-slate-500">
													<th className="py-2 px-2 text-left">변수</th>
													<th className="py-2 px-2">기온</th>
													<th className="py-2 px-2">습도</th>
													<th className="py-2 px-2">일조</th>
													<th className="py-2 px-2">불쾌지수</th>
													<th className="py-2 px-2 font-bold text-slate-700">부하지표</th>
												</tr>
											</thead>
											<tbody>
												{CORRELATION_DATA.map((row, i) => (
													<tr key={i} className="border-b border-slate-100">
														<td className="py-2.5 px-2 text-left font-semibold text-slate-700">{row.var}</td>
														<td className={`py-2 px-2 rounded ${getCorrBg(row.temp)}`}>{row.temp.toFixed(2)}</td>
														<td className={`py-2 px-2 rounded ${getCorrBg(row.humidity)}`}>{row.humidity.toFixed(2)}</td>
														<td className={`py-2 px-2 rounded ${getCorrBg(row.sunshine)}`}>{row.sunshine.toFixed(2)}</td>
														<td className={`py-2 px-2 rounded ${getCorrBg(row.di)}`}>{row.di.toFixed(2)}</td>
														<td className={`py-2 px-2 rounded ${getCorrBg(row.load)}`}>{row.load.toFixed(2)}</td>
													</tr>
												))}
											</tbody>
										</table>
									</div>
								</div>

								<div className="mt-4 p-3 bg-slate-50 rounded-xl text-xs text-slate-600 flex items-start gap-2">
									<i data-lucide="sparkles" className="w-4 h-4 text-emerald-600 mt-0.5 flex-shrink-0"></i>
									<span>
										부하지표와 가장 높은 양의 상관성을 보이는 인자는 <b>불쾌지수(0.89)</b>와 <b>기온(0.88)</b>입니다.
									</span>
								</div>
							</div>
						</div>

						{/* ── 2. 기술 통계량 요약 테이블 (Descriptive Summary) ── */}
						<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
							<h3 className="font-bold text-slate-900 text-base mb-1">데이터 기술 통계량 요약</h3>
							<p className="text-xs text-slate-400 mb-4">수집된 ASOS 시간자료(N=8,760시간)에 대한 분포 특성치</p>

							<div className="overflow-x-auto">
								<table className="w-full text-sm text-left">
									<thead>
										<tr className="border-b border-slate-200 text-slate-500 text-xs">
											<th className="py-2.5 px-3">인자명</th>
											<th className="py-2.5 px-3">평균(Mean)</th>
											<th className="py-2.5 px-3">표준편차(Std)</th>
											<th className="py-2.5 px-3">최소값(Min)</th>
											<th className="py-2.5 px-3">중앙값(Median)</th>
											<th className="py-2.5 px-3">최대값(Max)</th>
											<th className="py-2.5 px-3">왜도/분포 특성</th>
										</tr>
									</thead>
									<tbody>
										{STAT_TABLE.map((st, i) => (
											<tr key={i} className="border-b border-slate-50 hover:bg-slate-50/80 transition">
												<td className="py-2.5 px-3 font-semibold text-slate-800">{st.name}</td>
												<td className="py-2.5 px-3">{st.mean}</td>
												<td className="py-2.5 px-3 text-slate-500">±{st.std}</td>
												<td className="py-2.5 px-3">{st.min}</td>
												<td className="py-2.5 px-3">{st.p50}</td>
												<td className="py-2.5 px-3 font-medium text-slate-900">{st.max}</td>
												<td className="py-2.5 px-3 text-xs text-slate-500">
													<span className="px-2 py-0.5 bg-slate-100 rounded text-slate-600">{st.skew}</span>
												</td>
											</tr>
										))}
									</tbody>
								</table>
							</div>
						</div>
					</div>
				);
			}

			ReactDOM.createRoot(document.getElementById("root")).render(<EdaPage />);
		</script>
	</body>
</html>
