<!doctype html>
<html lang="ko" class="notranslate" translate="no">
	<head>
		<meta charset="UTF-8" />
		<meta name="google" content="notranslate" />
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>탐색적 데이터 분석 (EDA)</title>

		<script src="https://cdn.tailwindcss.com"></script>
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
		<style>
			body {
				font-family:
					"Pretendard",
					-apple-system,
					sans-serif;
			}
			::-webkit-scrollbar {
				width: 6px;
				height: 6px;
			}
			::-webkit-scrollbar-thumb {
				background: #cbd5e1;
				border-radius: 3px;
			}
		</style>

		<script>
			tailwind.config = { theme: { extend: { colors: { brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" } } } } };
		</script>
	</head>
	<body class="bg-slate-50 text-slate-800 p-4 sm:p-6 lg:p-8 notranslate" translate="no">
		<div id="root"></div>

		<script type="text/babel">
			const { useState, useEffect, useRef } = React;

			const STATIONS = [
				{ id: "108", name: "서울" },
				{ id: "112", name: "인천" },
				{ id: "159", name: "부산" },
				{ id: "143", name: "대구" },
				{ id: "156", name: "광주" },
				{ id: "133", name: "대전" },
			];

			function Icon({ name, className = "w-4 h-4" }) {
				if (name === "bar-chart")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 20V10M12 20V4M6 20v-6" />
						</svg>
					);
				if (name === "search")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
						</svg>
					);
				if (name === "info")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<circle cx="12" cy="12" r="10" strokeWidth="2" />
							<line x1="12" y1="16" x2="12" y2="12" strokeWidth="2" />
							<line x1="12" y1="8" x2="12.01" y2="8" strokeWidth="2" />
						</svg>
					);
				if (name === "bulb")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
						</svg>
					);
				if (name === "calendar")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<rect x="3" y="4" width="18" height="18" rx="2" ry="2" strokeWidth="2" />
							<line x1="16" y1="2" x2="16" y2="6" strokeWidth="2" />
							<line x1="8" y1="2" x2="8" y2="6" strokeWidth="2" />
							<line x1="3" y1="10" x2="21" y2="10" strokeWidth="2" />
						</svg>
					);
				if (name === "chevron-down")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
						</svg>
					);
				if (name === "chevron-up")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" />
						</svg>
					);
				return null;
			}

			function EdaApp() {
				const [station, setStation] = useState("108");
				const [startDate, setStartDate] = useState("2026-08-20");
				const [endDate, setEndDate] = useState("2026-08-27");

				const [calYear, setCalYear] = useState(() => parseInt("2026-08-20".split("-")[0]));
				const [calMonth, setCalMonth] = useState(() => parseInt("2026-08-20".split("-")[1]));
				const [calData, setCalData] = useState({});

				const [pickStep, setPickStep] = useState(0);

				const [loading, setLoading] = useState(false);
				const [loaded, setLoaded] = useState(false);
				const [data, setData] = useState({ hourly: [], daily: [] });
				const [error, setError] = useState(null);

				// 용어 설명 가이드 영역 접기/펴기 상태 (기본값: 닫힘)
				const [isGuideOpen, setIsGuideOpen] = useState(false);

				const chartTrend = useRef(null);
				const chartScatter = useRef(null);
				const chartBar = useRef(null);

				// 달력 데이터 Fetch
				useEffect(() => {
					const ym = `${calYear}-${String(calMonth).padStart(2, "0")}`;
					fetch(`/api/weather/calendar?stn=${station}&year_month=${ym}`)
						.then((r) => r.json())
						.then((d) => setCalData(d))
						.catch((e) => console.error(e));
				}, [station, calYear, calMonth]);

				// 달력 클릭 로직
				const handleCalClick = (dateStr) => {
					if (!calData[dateStr] || calData[dateStr] === 0) return;

					if (pickStep === 0) {
						setStartDate(dateStr);
						setEndDate(dateStr);
						setPickStep(1);
					} else {
						if (dateStr >= startDate) {
							setEndDate(dateStr);
							setPickStep(0);
						} else {
							setStartDate(dateStr);
							setEndDate(dateStr);
							setPickStep(1);
						}
					}
				};

				const fetchEdaData = async () => {
					setLoading(true);
					setError(null);
					setLoaded(false);
					try {
						const res = await fetch(`/api/weather/eda?stn=${station}&startDate=${startDate}&endDate=${endDate}`);
						if (!res.ok) throw new Error("데이터를 불러오지 못했습니다.");
						const result = await res.json();
						setData(result);

						if (result.hourly.length === 0) {
							setError("해당 기간에 데이터가 없습니다. 달력에서 초록색(수집됨)으로 표시된 날짜를 선택해주세요.");
						} else {
							setLoaded(true);
						}
					} catch (err) {
						setError(err.message);
					} finally {
						setLoading(false);
					}
				};

				// 차트 렌더링
				useEffect(() => {
					if (!loaded || data.hourly.length === 0) return;

					const formatXAxis = (tmStr) => {
						const parts = tmStr.split(" ");
						const md = parts[0].substring(5);
						return `${md} ${parts[1]}`;
					};
					const labels = data.hourly.map((d) => formatXAxis(d.tm));

					// 1. 추세 차트
					const ctxTrend = document.getElementById("chartTrend").getContext("2d");
					if (chartTrend.current) chartTrend.current.destroy();
					chartTrend.current = new Chart(ctxTrend, {
						type: "line",
						data: {
							labels: labels,
							datasets: [
								{ label: "기온 (℃)", data: data.hourly.map((d) => d.ta), borderColor: "#ef4444", backgroundColor: "#ef4444", yAxisID: "y", tension: 0.3, pointRadius: 0, borderWidth: 2 },
								{ label: "추정 부하 (kW)", data: data.hourly.map((d) => d.load_kw), type: "bar", backgroundColor: "rgba(59, 130, 246, 0.4)", yAxisID: "y1" },
							],
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							interaction: { mode: "index", intersect: false },
							scales: {
								x: { ticks: { maxTicksLimit: 12 } },
								y: { type: "linear", display: true, position: "left", title: { display: true, text: "기온(℃)" } },
								y1: { type: "linear", display: true, position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "부하(kW)" } },
							},
						},
					});

					// 2. 산점도 차트
					const ctxScatter = document.getElementById("chartScatter").getContext("2d");
					if (chartScatter.current) chartScatter.current.destroy();
					chartScatter.current = new Chart(ctxScatter, {
						type: "scatter",
						data: { datasets: [{ label: "기온 대비 부하량", data: data.hourly.map((d) => ({ x: d.ta, y: d.load_kw })), backgroundColor: "rgba(99, 102, 241, 0.6)", borderColor: "rgba(99, 102, 241, 1)" }] },
						options: { responsive: true, maintainAspectRatio: false, scales: { x: { title: { display: true, text: "기온 (℃)" } }, y: { title: { display: true, text: "추정 부하 (kW)" } } } },
					});

					// 3. 누적 바 차트
					const ctxBar = document.getElementById("chartBar").getContext("2d");
					if (chartBar.current) chartBar.current.destroy();
					chartBar.current = new Chart(ctxBar, {
						type: "bar",
						data: {
							labels: data.daily.map((d) => d.ymd.slice(5)),
							datasets: [
								{ label: "냉방도일(CDD)", data: data.daily.map((d) => d.sum_cdd), backgroundColor: "#3b82f6" },
								{ label: "난방도일(HDD)", data: data.daily.map((d) => d.sum_hdd), backgroundColor: "#f97316" },
							],
						},
						options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, title: { display: true, text: "일별 지수 합산" } } } },
					});
				}, [loaded, data]);

				const generateCalendar = () => {
					const daysInMonth = new Date(calYear, calMonth, 0).getDate();
					const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
					const grid = [];
					for (let i = 0; i < firstDay; i++) grid.push(null);
					for (let i = 1; i <= daysInMonth; i++) grid.push(`${calYear}-${String(calMonth).padStart(2, "0")}-${String(i).padStart(2, "0")}`);
					return grid;
				};

				const avgTemp = data.daily.length > 0 ? (data.daily.reduce((acc, cur) => acc + cur.avg_ta, 0) / data.daily.length).toFixed(1) : 0;
				const maxLoad = data.hourly.length > 0 ? Math.max(...data.hourly.map((d) => d.load_kw)).toFixed(1) : 0;
				const totalCDD = data.daily.length > 0 ? data.daily.reduce((acc, cur) => acc + cur.sum_cdd, 0).toFixed(1) : 0;
				const totalHDD = data.daily.length > 0 ? data.daily.reduce((acc, cur) => acc + cur.sum_hdd, 0).toFixed(1) : 0;

				return (
					<div className="max-w-[1400px] mx-auto space-y-6 pb-12">
						{/* Header */}
						<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
							<div>
								<h1 className="text-xl font-bold text-slate-900">탐색적 데이터 분석 (EDA) 대시보드</h1>
								<p className="text-xs sm:text-sm text-slate-500 mt-1">기상 변수와 에너지 부하량 간의 상관관계를 시각화하고 특징을 도출합니다.</p>
							</div>
							<a href="/data.html" className="text-sm font-bold text-brand-600 hover:text-brand-700 bg-brand-50 px-4 py-2 rounded-lg transition text-center">
								데이터 수집으로 이동
							</a>
						</div>

						<div className="flex flex-col lg:flex-row gap-6 items-start">
							{/* ─── 좌측 사이드바 (조건 설정 및 달력) ─── */}
							<aside className="w-full lg:w-[340px] flex-shrink-0 flex flex-col gap-4 lg:sticky lg:top-6 z-20">
								<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-5">
									<div className="flex items-center gap-2 border-b border-slate-100 pb-3">
										<span className="w-5 h-5 rounded-md bg-slate-800 text-white flex items-center justify-center text-xs font-bold">1</span>
										<h2 className="font-bold text-slate-900">분석 조건 설정</h2>
									</div>

									{/* 지역 선택 */}
									<div>
										<label className="block text-xs font-semibold text-slate-600 mb-1.5">분석 대상 지역</label>
										<select value={station} onChange={(e) => setStation(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none">
											{STATIONS.map((s) => (
												<option key={s.id} value={s.id}>
													{s.name} ({s.id})
												</option>
											))}
										</select>
									</div>

									{/* 인터랙티브 달력 */}
									<div className="pt-2">
										<div className="flex justify-between items-center mb-4">
											<label className="block text-xs font-semibold text-slate-600">조회 기간 선택</label>
											<div className="flex items-center gap-2">
												<button
													onClick={() => {
														if (calMonth === 1) {
															setCalMonth(12);
															setCalYear(calYear - 1);
														} else setCalMonth(calMonth - 1);
													}}
													className="p-1 bg-slate-50 hover:bg-slate-100 rounded text-slate-600 font-bold transition"
												>
													&lt;
												</button>
												<span className="font-bold text-[13px] w-14 text-center text-slate-800">
													{calYear}.{String(calMonth).padStart(2, "0")}
												</span>
												<button
													onClick={() => {
														if (calMonth === 12) {
															setCalMonth(1);
															setCalYear(calYear + 1);
														} else setCalMonth(calMonth + 1);
													}}
													className="p-1 bg-slate-50 hover:bg-slate-100 rounded text-slate-600 font-bold transition"
												>
													&gt;
												</button>
											</div>
										</div>

										<div className="grid grid-cols-7 gap-1">
											{["일", "월", "화", "수", "목", "금", "토"].map((d) => (
												<div key={d} className="text-center text-[11px] font-bold text-slate-400 py-1">
													{d}
												</div>
											))}
											{generateCalendar().map((dateStr, i) => {
												if (!dateStr) return <div key={i} />;
												const dNum = dateStr.split("-")[2].replace(/^0/, "");
												const hasData = calData[dateStr] > 0;

												const isStart = dateStr === startDate;
												const isEnd = dateStr === endDate;
												const inRange = dateStr >= startDate && dateStr <= endDate;

												let bgClass = "bg-transparent";
												let textClass = "text-slate-300 cursor-not-allowed";

												if (hasData) {
													bgClass = "bg-emerald-50/50 hover:bg-emerald-100 border border-emerald-100 cursor-pointer";
													textClass = "text-emerald-700 font-bold";
												}
												if (hasData && inRange) {
													bgClass = "bg-brand-50 border border-brand-200 cursor-pointer";
													textClass = "text-brand-700 font-bold";
												}
												if (hasData && (isStart || isEnd)) {
													bgClass = "bg-brand-500 border border-brand-600 shadow-sm cursor-pointer";
													textClass = "text-white font-bold";
												}

												return (
													<div key={dateStr} onClick={() => handleCalClick(dateStr)} className={`rounded text-center py-1.5 text-xs transition-all duration-150 ${bgClass} ${textClass}`}>
														{dNum}
													</div>
												);
											})}
										</div>

										{/* 선택된 기간 한줄 요약 피드백 */}
										<div className="mt-4 px-3 py-2.5 bg-slate-50 rounded-lg border border-slate-200 flex flex-col gap-1 text-center">
											<div className="flex items-center justify-between">
												<span className="text-[11px] font-bold text-slate-500">선택 기간</span>
												<div className="flex items-center gap-1.5">
													<span className="text-[13px] font-bold text-brand-700">{startDate}</span>
													<span className="text-[11px] text-slate-400">~</span>
													<span className="text-[13px] font-bold text-brand-700">{endDate}</span>
												</div>
											</div>
											{pickStep === 1 && <p className="text-[11px] text-rose-500 font-semibold mt-1 animate-pulse text-right">마지막 종료일을 클릭해주세요</p>}
										</div>
									</div>

									<button type="button" onClick={fetchEdaData} disabled={loading || pickStep === 1} className="w-full bg-slate-800 hover:bg-slate-900 text-white rounded-lg px-4 py-3 text-sm font-bold shadow-sm transition disabled:opacity-50 flex items-center justify-center gap-2 mt-2">
										{loading ? (
											"데이터 분석 중..."
										) : (
											<>
												<Icon name="search" />
												데이터 시각화 실행
											</>
										)}
									</button>
								</div>
							</aside>

							{/* ─── 우측 메인 (차트 & 결과) ─── */}
							<main className="flex-1 w-full min-w-0 space-y-6">
								{error && <div className="p-4 bg-rose-50 border border-rose-200 rounded-2xl text-rose-800 text-sm font-bold">{error}</div>}

								{/* 빈 화면 (Empty State) */}
								{!loaded && !loading && !error && (
									<div className="bg-white rounded-2xl shadow-sm border border-dashed border-slate-300 p-8 sm:p-16 text-center relative overflow-hidden h-[500px] flex items-center justify-center animate-fade-in">
										<div className="absolute inset-0 bg-[linear-gradient(to_right,#f8fafc_1px,transparent_1px),linear-gradient(to_bottom,#f8fafc_1px,transparent_1px)] bg-[size:40px_40px]"></div>
										<div className="relative z-10 flex flex-col items-center">
											<div className="w-16 h-16 bg-brand-50 rounded-full flex items-center justify-center mb-4">
												<Icon name="calendar" className="text-brand-500 w-8 h-8" />
											</div>
											<h3 className="text-lg font-bold text-slate-700 mb-2">분석할 기간을 선택해주세요</h3>
											<p className="text-sm text-slate-500 leading-relaxed max-w-md mx-auto">
												좌측 달력에서 데이터가 <b>수집된 날짜(초록색)</b>를 클릭하여
												<br />
												시작일과 종료일을 지정한 뒤 시각화 버튼을 눌러주세요.
											</p>
										</div>
									</div>
								)}

								{/* 대시보드 렌더링 영역 */}
								{loaded && !loading && !error && (
									<div className="space-y-6 animate-fade-in">
										{/* 설명 가이드 배너 (접기/펴기 적용) */}
										<div className="bg-slate-800 text-white rounded-2xl shadow-sm overflow-hidden border border-slate-700 transition-all">
											{/* 토글 버튼 (항상 노출) */}
											<button onClick={() => setIsGuideOpen(!isGuideOpen)} className="w-full flex items-center justify-between p-4 sm:px-5 hover:bg-slate-700 transition-colors">
												<span className="font-bold text-sm text-slate-200 flex items-center gap-2">
													<Icon name="bulb" className="text-amber-400 w-5 h-5" />
													분석 지표 (추정 부하, CDD/HDD) 용어 설명 보기
												</span>
												<Icon name={isGuideOpen ? "chevron-up" : "chevron-down"} className="text-slate-400 w-5 h-5" />
											</button>

											{/* 펼쳐질 때 보이는 내용 */}
											{isGuideOpen && (
												<div className="px-4 sm:px-5 pb-5 pt-2 border-t border-slate-700 flex flex-col xl:flex-row gap-5 animate-fade-in bg-slate-800">
													<div className="flex-1 space-y-2">
														<h3 className="font-bold text-brand-300">추정 부하 (kW)란?</h3>
														<p className="text-[13px] text-slate-300 leading-relaxed">
															실제 도시 전체 전력량이 아닌, 기상 조건 변화가 에너지 수요에 미치는 영향을 순수하게 분석하기 위해 시뮬레이션한 <b>'단위 표준 건물'의 전력 부하량</b>입니다. 기온에 따른 에너지 민감도를 평가하는 종속 변수로 활용됩니다.
														</p>
													</div>
													<div className="w-px bg-slate-600 hidden xl:block"></div>
													<div className="flex-1 space-y-2">
														<h3 className="font-bold text-amber-300">냉/난방도일(CDD/HDD) 수치의 의미</h3>
														<p className="text-[13px] text-slate-300 leading-relaxed">
															냉방도일(CDD)은 기준 온도(24℃)를 초과한 온도의 합산을 뜻합니다. 예를 들어 <b>CDD 누적값이 4.5</b>라면, 그날 하루의 체감 평균기온이 <b>28.5℃ (24+4.5)</b>로 유지되었음을 의미하며 이 수치가 클수록 에너지가 급증합니다.
														</p>
													</div>
												</div>
											)}
										</div>

										{/* Summary KPIs */}
										<section className="grid grid-cols-2 lg:grid-cols-4 gap-4">
											<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 sm:p-5 border-l-4 border-l-rose-500">
												<span className="text-xs font-medium text-slate-500">기간 평균 기온</span>
												<p className="text-xl sm:text-2xl font-bold text-slate-900 mt-1">
													{avgTemp} <span className="text-sm font-normal text-slate-400">℃</span>
												</p>
											</div>
											<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 sm:p-5 border-l-4 border-l-brand-500">
												<span className="text-xs font-medium text-slate-500">누적 냉방도일(CDD)</span>
												<p className="text-xl sm:text-2xl font-bold text-brand-600 mt-1">{totalCDD}</p>
											</div>
											<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 sm:p-5 border-l-4 border-l-orange-500">
												<span className="text-xs font-medium text-slate-500">누적 난방도일(HDD)</span>
												<p className="text-xl sm:text-2xl font-bold text-orange-600 mt-1">{totalHDD}</p>
											</div>
											<div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 sm:p-5 border-l-4 border-l-slate-800">
												<span className="text-xs font-medium text-slate-500">최대 부하</span>
												<p className="text-xl sm:text-2xl font-bold text-slate-900 mt-1">
													{maxLoad} <span className="text-sm font-normal text-slate-400">kW</span>
												</p>
											</div>
										</section>

										{/* 차트 1: 추세선 */}
										<div className="bg-white p-4 sm:p-6 rounded-2xl border border-slate-100 shadow-sm w-full">
											<h3 className="text-sm font-bold text-slate-900 mb-1 flex items-center gap-2">
												<Icon name="bar-chart" /> 시계열 기온-전력 부하 동기화 패턴
											</h3>
											<p className="text-[11px] sm:text-xs text-slate-500 mb-4">시간 흐름에 따른 기온 상승이 전력 부하 곡선을 얼마나 유사하게 끌어올리는지 패턴을 입증합니다.</p>
											<div className="relative h-64 sm:h-80 w-full min-w-0">
												<canvas id="chartTrend"></canvas>
											</div>
										</div>

										{/* 차트 2,3: 산점도 & 바차트 */}
										<div className="grid grid-cols-1 xl:grid-cols-2 gap-6 w-full">
											<div className="bg-white p-4 sm:p-6 rounded-2xl border border-slate-100 shadow-sm w-full min-w-0">
												<h3 className="text-sm font-bold text-slate-900 mb-1">기온 vs 전력 부하 (Scatter)</h3>
												<p className="text-[11px] sm:text-xs text-slate-500 mb-4">임계점을 넘을 때 부하가 상승하는 비선형(U/V형) 관계를 도출합니다.</p>
												<div className="relative h-64 sm:h-72 w-full">
													<canvas id="chartScatter"></canvas>
												</div>
											</div>

											<div className="bg-white p-4 sm:p-6 rounded-2xl border border-slate-100 shadow-sm w-full min-w-0">
												<h3 className="text-sm font-bold text-slate-900 mb-1">일별 냉/난방 에너지 소비 지수</h3>
												<p className="text-[11px] sm:text-xs text-slate-500 mb-4">기준 온도를 초과한 누적값(CDD/HDD)을 통해 실제 에너지 소요량을 비교합니다.</p>
												<div className="relative h-64 sm:h-72 w-full">
													<canvas id="chartBar"></canvas>
												</div>
											</div>
										</div>
									</div>
								)}
							</main>
						</div>
					</div>
				);
			}

			ReactDOM.createRoot(document.getElementById("root")).render(<EdaApp />);
		</script>
	</body>
</html>
