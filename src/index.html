<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="google" content="notranslate" />
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>WeatherLoad | 기상 데이터 에너지 부하 분석</title>

		<!-- Tailwind CSS CDN -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- React & ReactDOM CDN -->
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<!-- Babel (JSX 변환용) -->
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
		<!-- Lucide Icons -->
		<script src="https://unpkg.com/lucide@latest"></script>

		<!-- Pretendard 폰트 -->
		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

		<style>
			body {
				font-family:
					"Pretendard",
					-apple-system,
					sans-serif;
			}
			::-webkit-scrollbar {
				width: 8px;
				height: 8px;
			}
			::-webkit-scrollbar-thumb {
				background: #cbd5e1;
				border-radius: 4px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
		</style>

		<!-- Tailwind 커스텀 설정 -->
		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							brand: {
								50: "#eff6ff",
								100: "#dbeafe",
								500: "#3b82f6",
								600: "#2563eb",
								700: "#1d4ed8",
								900: "#1e3a8a",
							},
						},
						animation: {
							"fade-in": "fadeIn 0.4s ease-in-out",
						},
						keyframes: {
							fadeIn: {
								"0%": { opacity: "0", transform: "translateY(8px)" },
								"100%": { opacity: "1", transform: "translateY(0)" },
							},
						},
					},
				},
			};
		</script>
	</head>
	<body class="bg-slate-50 text-slate-800 p-4 sm:p-6 lg:p-8 notranslate" translate="no">
		<div id="root"></div>

		<script type="text/babel">
			const { useState, useEffect, useCallback } = React;

			// 네비게이션 메뉴 및 로드할 파일 매핑
			const NAV_ITEMS = [
				{ id: "dashboard", label: "대시보드", icon: "layout-dashboard", file: "./dashboard.html" },
				{ id: "collect", label: "데이터 수집/정제", icon: "database", file: "./data.html" },
				{ id: "eda", label: "탐색적 분석(EDA)", icon: "bar-chart-3", file: "./eda.html" },
				{ id: "forecast", label: "시계열 예측", icon: "trending-up", file: "./predict.html" },
				{ id: "report", label: "리포트", icon: "file-text", file: "./report.html" },
			];

			// ===== GNB (상단 네비게이션 바) =====
			function Navbar({ activeMenu, setActiveMenu, onMenuToggle }) {
				return (
					<header className="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
						<div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
							<div className="flex items-center justify-between h-16">
								{/* 로고 영역 */}
								<div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveMenu("dashboard")}>
									<div className="w-9 h-9 bg-gradient-to-br from-brand-500 to-brand-700 rounded-lg flex items-center justify-center text-white font-bold shadow-lg shadow-brand-500/30">W</div>
									<span className="text-lg font-bold tracking-tight text-slate-900">
										Weather<span className="text-brand-600">Load</span>
									</span>
								</div>

								{/* 데스크탑 메뉴 */}
								<nav className="hidden md:flex items-center gap-1">
									{NAV_ITEMS.map((item) => (
										<button key={item.id} onClick={() => setActiveMenu(item.id)} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 ${activeMenu === item.id ? "bg-brand-50 text-brand-700 font-semibold" : "text-slate-600 hover:bg-slate-100"}`}>
											{item.label}
										</button>
									))}
								</nav>

								{/* 모바일 햄버거 버튼 */}
								<button onClick={onMenuToggle} className="md:hidden p-2 rounded-lg hover:bg-slate-100 transition">
									<i data-lucide="menu" className="w-6 h-6"></i>
								</button>
							</div>
						</div>
					</header>
				);
			}

			// ===== 모바일 사이드 메뉴 =====
			function MobileMenu({ isOpen, activeMenu, setActiveMenu, onClose }) {
				if (!isOpen) return null;
				return (
					<div className="md:hidden fixed inset-0 z-50">
						{/* 배경 오버레이 */}
						<div className="absolute inset-0 bg-black/30 backdrop-blur-sm" onClick={onClose}></div>
						{/* 메뉴 패널 */}
						<div className="absolute top-0 right-0 w-64 h-full bg-white shadow-2xl p-4 animate-fade-in">
							<div className="flex justify-between items-center mb-6 pt-2">
								<span className="font-bold text-slate-900">메뉴</span>
								<button onClick={onClose} className="p-1 hover:bg-slate-100 rounded">
									<i data-lucide="x" className="w-5 h-5"></i>
								</button>
							</div>
							<nav className="flex flex-col gap-1">
								{NAV_ITEMS.map((item) => (
									<button
										key={item.id}
										onClick={() => {
											setActiveMenu(item.id);
											onClose();
										}}
										className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition ${activeMenu === item.id ? "bg-brand-50 text-brand-700 font-semibold" : "text-slate-600 hover:bg-slate-100"}`}
									>
										<i data-lucide={item.icon} className="w-5 h-5"></i>
										{item.label}
									</button>
								))}
							</nav>
						</div>
					</div>
				);
			}

			// ===== 메인 콘텐츠 뷰 영역 =====
			function MainContent({ activeMenu, pageHtml, loading, error }) {
				const current = NAV_ITEMS.find((i) => i.id === activeMenu);

				// 1. 로딩 상태
				if (loading) {
					return (
						<main className="pt-16 min-h-screen flex items-center justify-center">
							<div className="text-center py-16 animate-fade-in">
								<div className="w-10 h-10 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin mx-auto mb-4"></div>
								<p className="text-slate-600 text-sm font-medium">'{current?.label}' 화면을 불러오는 중입니다...</p>
							</div>
						</main>
					);
				}

				// 2. 에러 상태 (CORS 또는 파일 누락 등)
				if (error) {
					return (
						<main className="pt-16 min-h-screen">
							<div className="max-w-4xl mx-auto px-4 py-12 animate-fade-in">
								<div className="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-amber-900 shadow-sm">
									<div className="flex items-center gap-3 mb-3">
										<div className="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center text-amber-700">
											<i data-lucide="alert-circle" className="w-6 h-6"></i>
										</div>
										<div>
											<h2 className="text-lg font-bold">화면 로드 안내</h2>
											<p className="text-sm text-amber-700">{error}</p>
										</div>
									</div>

									<div className="mt-4 pt-4 border-t border-amber-200/60 text-xs text-amber-800 space-y-2">
										<p className="font-semibold">💡 로컬 파일 직접 실행(CORS) 관련 해결 가이드:</p>
										<ul className="list-disc list-inside space-y-1 pl-1">
											<li>
												브라우저에서 직접 <code className="bg-amber-100 px-1 py-0.5 rounded">file:///</code>로 열면 fetch 보안 정책에 의해 차단될 수 있습니다.
											</li>
											<li>
												터미널에서 <code className="bg-amber-100 px-1 py-0.5 rounded">python -m http.server 8000</code> 실행 후 <code className="bg-amber-100 px-1 py-0.5 rounded">http://localhost:8000</code>으로 접속해 주세요.
											</li>
											<li>
												또는 해당 탭 파일(<code className="bg-amber-100 px-1 py-0.5 rounded">{current?.file}</code>)이 같은 폴더에 생성되어 있는지 확인해 주세요.
											</li>
										</ul>
									</div>
								</div>
							</div>
						</main>
					);
				}

				// 3. fetch로 로드한 서브 페이지 iframe 렌더링
				if (pageHtml) {
					return (
						<main className="pt-16 min-h-screen">
							<iframe title={current?.label} srcDoc={pageHtml} className="w-full min-h-[calc(100vh-4rem)] border-0" />
						</main>
					);
				}

				// 4. 기본 폴백 뷰 (파일이 없을 때의 안내 카드)
				return (
					<main className="pt-16 min-h-screen">
						<div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
							<div className="mb-8">
								<div className="flex items-center gap-3 mb-2">
									<div className="w-10 h-10 bg-brand-50 rounded-lg flex items-center justify-center">
										<i data-lucide={current?.icon} className="w-5 h-5 text-brand-600"></i>
									</div>
									<h1 className="text-2xl font-bold text-slate-900">{current?.label}</h1>
								</div>
								<p className="text-slate-500 text-sm">기상 데이터 기반 냉난방 에너지 부하 분석 서비스</p>
							</div>

							<div className="bg-white rounded-2xl p-8 border border-slate-100 shadow-sm text-center py-16">
								<div className="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center mx-auto mb-4 text-slate-400">
									<i data-lucide="file-code-2" className="w-6 h-6"></i>
								</div>
								<h3 className="font-semibold text-slate-800 text-base mb-1">{current?.file} 파일이 필요합니다</h3>
								<p className="text-sm text-slate-500">해당 탭의 독립 HTML 파일이 추가되면 자동으로 화면이 연동됩니다.</p>
							</div>
						</div>
					</main>
				);
			}

			// ===== 앱 루트 =====
			function App() {
				const [activeMenu, setActiveMenu] = useState("dashboard");
				const [mobileOpen, setMobileOpen] = useState(false);

				// 탭별 로드된 HTML 캐시 저장소 { collect: "<html>...", eda: "<html>..." }
				const [pagesCache, setPagesCache] = useState({});
				const [loading, setLoading] = useState(false);
				const [error, setError] = useState(null);

				// 페이지 fetch 로딩 핸들러
				const loadPageContent = useCallback(
					async (tabId) => {
						const item = NAV_ITEMS.find((nav) => nav.id === tabId);
						if (!item || !item.file) return;

						// 이미 캐시되어 있으면 다시 fetch하지 않음
						if (pagesCache[tabId]) {
							setError(null);
							return;
						}

						// file:// 프로토콜 직접 접근 시 안내
						if (window.location.protocol === "file:") {
							setError("로컬 파일(file://) 환경에서는 fetch가 차단됩니다. 로컬 웹 서버(python -m http.server 등)를 실행해 주세요.");
							return;
						}

						setLoading(true);
						setError(null);

						try {
							const response = await fetch(item.file);
							if (!response.ok) {
								throw new Error(`'${item.file}' 파일을 찾을 수 없습니다. (상태 코드: ${response.status})`);
							}
							const htmlText = await response.text();
							setPagesCache((prev) => ({ ...prev, [tabId]: htmlText }));
						} catch (err) {
							setError(err.message || "페이지를 불러오는 중 오류가 발생했습니다.");
						} finally {
							setLoading(false);
						}
					},
					[pagesCache],
				);

				// 메뉴 변경 시 fetch 실행
				useEffect(() => {
					loadPageContent(activeMenu);
				}, [activeMenu, loadPageContent]);

				// Lucide 아이콘 렌더링 갱신
				useEffect(() => {
					if (window.lucide) {
						window.lucide.createIcons();
					}
				});

				return (
					<div>
						<Navbar activeMenu={activeMenu} setActiveMenu={setActiveMenu} onMenuToggle={() => setMobileOpen(true)} />
						<MobileMenu isOpen={mobileOpen} activeMenu={activeMenu} setActiveMenu={setActiveMenu} onClose={() => setMobileOpen(false)} />
						<MainContent activeMenu={activeMenu} pageHtml={pagesCache[activeMenu]} loading={loading} error={error} />
					</div>
				);
			}

			ReactDOM.createRoot(document.getElementById("root")).render(<App />);
		</script>
	</body>
</html>
