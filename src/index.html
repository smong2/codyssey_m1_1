<!doctype html>
<html lang="ko" class="notranslate" translate="no">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>WeatherLoad | 기상 부하 예측 대시보드</title>

		<script src="https://cdn.tailwindcss.com"></script>
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

		<style>
			body {
				font-family:
					"Pretendard",
					-apple-system,
					sans-serif;
			}
			::-webkit-scrollbar {
				width: 6px;
				height: 6px;
			}
			::-webkit-scrollbar-thumb {
				background: #cbd5e1;
				border-radius: 3px;
			}
		</style>

		<script>
			tailwind.config = { theme: { extend: { colors: { brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" } } } } };
		</script>
	</head>
	<body class="bg-slate-50 text-slate-800 notranslate" translate="no">
		<div id="root"></div>

		<script type="text/babel">
			const { useState, useEffect } = React;

			const STATIONS = [
				{ id: "108", name: "서울" },
				{ id: "112", name: "인천" },
				{ id: "159", name: "부산" },
				{ id: "143", name: "대구" },
				{ id: "156", name: "광주" },
				{ id: "133", name: "대전" },
			];

			function Icon({ name, className = "w-4 h-4" }) {
				if (name === "database")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
						</svg>
					);
				if (name === "activity")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
						</svg>
					);
				if (name === "check-circle")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
						</svg>
					);
				if (name === "alert-circle")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
						</svg>
					);
				if (name === "arrow-right")
					return (
						<svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
						</svg>
					);
				return null;
			}

			function MainDashboard() {
				const [station, setStation] = useState("108");
				const [stats, setStats] = useState(null);
				const [loading, setLoading] = useState(true);

				useEffect(() => {
					setLoading(true);
					fetch(`/api/weather/dashboard?stn=${station}`)
						.then((res) => res.json())
						.then((data) => {
							setStats(data);
							setLoading(false);
						})
						.catch((err) => {
							console.error(err);
							setLoading(false);
						});
				}, [station]);

				return (
					<div className="min-h-screen flex flex-col">
						{/* GNB */}
						<nav className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
							<div className="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
								<div className="flex justify-between items-center h-14">
									<div className="flex items-center gap-8">
										<span className="text-lg font-black text-brand-600 tracking-tight">WeatherLoad</span>
										<div className="hidden sm:flex space-x-6">
											<a href="/" className="text-brand-600 border-brand-600 px-1 py-4 border-b-2 text-sm font-bold transition">
												홈 (대시보드)
											</a>
											<a href="/data.html" className="text-slate-500 hover:text-slate-900 px-1 py-4 border-b-2 border-transparent text-sm font-bold transition">
												1. 데이터 수집
											</a>
											<a href="/eda.html" className="text-slate-500 hover:text-slate-900 px-1 py-4 border-b-2 border-transparent text-sm font-bold transition">
												2. 탐색적 분석(EDA)
											</a>
											<a href="/predict.html" className="text-slate-500 hover:text-slate-900 px-1 py-4 border-b-2 border-transparent text-sm font-bold transition">
												3. 시계열 예측
											</a>
											<a href="/report.html" className="text-slate-500 hover:text-slate-900 px-1 py-4 border-b-2 border-transparent text-sm font-bold transition">
												4. 종합 리포트
											</a>
										</div>
									</div>
								</div>
							</div>
						</nav>

						<div className="flex-1 max-w-[1400px] w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
							{/* 상단 타이틀 및 관측소 선택 */}
							<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
								<div>
									<h1 className="text-xl font-bold text-slate-900">기상 데이터 및 에너지 부하 운영 대시보드</h1>
									<p className="text-xs sm:text-sm text-slate-500 mt-0.5">실시간 데이터 수집 상태와 파이프라인 무결성을 모니터링합니다.</p>
								</div>
								<div className="flex items-center gap-3">
									<label className="text-xs font-semibold text-slate-600">기준 관측소:</label>
									<select value={station} onChange={(e) => setStation(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-1.5 font-bold focus:ring-2 focus:ring-brand-500 outline-none">
										{STATIONS.map((s) => (
											<option key={s.id} value={s.id}>
												{s.name} ({s.id})
											</option>
										))}
									</select>
								</div>
							</div>

							{/* 스마트 폴백 상태 배너 (오늘 데이터 없을 때 안내) */}
							{stats && stats.is_fallback && (
								<div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-center gap-3 text-amber-900 animate-fade-in">
									<Icon name="alert-circle" className="w-5 h-5 text-amber-600 flex-shrink-0" />
									<div className="text-xs sm:text-sm">
										<b>실시간 집계 대기 중 안내:</b> 오늘({stats.today_str}) 실시간 기상 데이터가 아직 모두 집계되지 않아, 가장 최근 데이터가 완비된 <b>[{stats.active_date}]</b> 기준으로 대시보드 요약 정보를 대체하여 표시합니다.
									</div>
								</div>
							)}

							{loading ? (
								<div className="py-24 text-center text-slate-400 font-bold">시스템 상태 통계를 불러오는 중입니다...</div>
							) : (
								stats && (
									<div className="space-y-6 animate-fade-in">
										{/* 1. 수집 통계 및 실적 요약 KPI 카드 */}
										<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
											<div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm border-l-4 border-l-brand-500">
												<span className="text-xs font-medium text-slate-500">오늘 실시간 수집 현황</span>
												<div className="text-2xl font-bold text-slate-900 mt-1">
													{stats.today_collected_hours} <span className="text-sm font-normal text-slate-400">/ 24 시간</span>
												</div>
												<div className="w-full bg-slate-100 h-1.5 rounded-full mt-3 overflow-hidden">
													<div className="bg-brand-500 h-full rounded-full" style={{ width: `${(stats.today_collected_hours / 24) * 100}%` }}></div>
												</div>
											</div>

											<div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm border-l-4 border-l-emerald-500">
												<span className="text-xs font-medium text-slate-500">데이터베이스 누적 적재</span>
												<div className="text-2xl font-bold text-slate-900 mt-1">
													{stats.total_records.toLocaleString()} <span className="text-sm font-normal text-slate-400">Records</span>
												</div>
												<p className="mt-2 text-xs text-emerald-600 font-semibold flex items-center gap-1">
													<Icon name="check-circle" className="w-3.5 h-3.5" /> 파이프라인 정상 가동 중
												</p>
											</div>

											<div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
												<span className="text-xs font-medium text-slate-500">기준일({stats.active_date}) 평균 기온</span>
												<div className="text-2xl font-bold text-rose-600 mt-1">
													{stats.summary.avg_ta} <span className="text-sm font-normal text-rose-400">℃</span>
												</div>
												<p className="mt-2 text-xs text-slate-400">평균 습도: {stats.summary.avg_hm}%</p>
											</div>

											<div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
												<span className="text-xs font-medium text-slate-500">기준일 총 추정 부하</span>
												<div className="text-2xl font-bold text-slate-900 mt-1">
													{stats.summary.total_load.toLocaleString()} <span className="text-sm font-normal text-slate-400">kW</span>
												</div>
												<p className="mt-2 text-xs text-slate-400">분석 시간: {stats.summary.hours}시간 집계</p>
											</div>
										</div>

										{/* 2. 빠른 메뉴 이동 카드 */}
										<div className="grid grid-cols-1 md:grid-cols-3 gap-6">
											<a href="/data.html" className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:border-brand-300 hover:shadow-md transition group flex flex-col justify-between">
												<div>
													<div className="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center font-bold mb-4">01</div>
													<h3 className="font-bold text-slate-900 text-lg group-hover:text-brand-600 transition">데이터 수집 및 정제</h3>
													<p className="text-xs text-slate-500 mt-1 leading-relaxed">기상청 API 연동, 결측치 자동 대치(Audit Trail), 달력 형태의 일별 수집 현황 조회</p>
												</div>
												<div className="mt-6 flex items-center gap-1 text-xs font-bold text-brand-600">
													수집 관리로 이동 <Icon name="arrow-right" className="w-3.5 h-3.5 group-hover:translate-x-1 transition" />
												</div>
											</a>

											<a href="/eda.html" className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:border-brand-300 hover:shadow-md transition group flex flex-col justify-between">
												<div>
													<div className="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold mb-4">02</div>
													<h3 className="font-bold text-slate-900 text-lg group-hover:text-purple-600 transition">탐색적 분석 (EDA)</h3>
													<p className="text-xs text-slate-500 mt-1 leading-relaxed">기온, 습도, 일조량 간의 상관관계 분석 및 파생 지표(불쾌지수, 냉난방도일) 시각화</p>
												</div>
												<div className="mt-6 flex items-center gap-1 text-xs font-bold text-purple-600">
													EDA 분석으로 이동 <Icon name="arrow-right" className="w-3.5 h-3.5 group-hover:translate-x-1 transition" />
												</div>
											</a>

											<a href="/predict.html" className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm hover:border-brand-300 hover:shadow-md transition group flex flex-col justify-between">
												<div>
													<div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold mb-4">03</div>
													<h3 className="font-bold text-slate-900 text-lg group-hover:text-amber-600 transition">시계열 부하 예측</h3>
													<p className="text-xs text-slate-500 mt-1 leading-relaxed">Prophet, SARIMA 모델 기반 백테스팅 수행 및 향후 24h~7d 미래 피크 부하 예측</p>
												</div>
												<div className="mt-6 flex items-center gap-1 text-xs font-bold text-amber-600">
													예측 모델로 이동 <Icon name="arrow-right" className="w-3.5 h-3.5 group-hover:translate-x-1 transition" />
												</div>
											</a>
										</div>

										{/* 3. 관측소별 파이프라인 수집 상태 요약 테이블 */}
										<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
											<h3 className="font-bold text-slate-900 mb-4 flex items-center gap-2">
												<Icon name="database" className="text-slate-500" /> 전국 주요 관측소 데이터 적재 현황
											</h3>
											<div className="overflow-x-auto border border-slate-200 rounded-xl">
												<table className="w-full text-xs text-center border-collapse">
													<thead className="bg-slate-100 text-slate-600 font-bold">
														<tr>
															<th className="py-2.5 px-3 border-b border-r border-slate-200">관측소 ID</th>
															<th className="py-2.5 px-3 border-b border-r border-slate-200">지역명</th>
															<th className="py-2.5 px-3 border-b border-r border-slate-200">최근 수집 시각</th>
															<th className="py-2.5 px-3 border-b border-slate-200">누적 수집 건수</th>
														</tr>
													</thead>
													<tbody className="divide-y divide-slate-100">
														{STATIONS.map((s) => {
															const stat = stats.stations_status.find((x) => x.stn_id === s.id);
															return (
																<tr key={s.id} className="hover:bg-slate-50 transition">
																	<td className="py-2.5 px-3 border-r border-slate-100 font-mono font-bold text-slate-700">{s.id}</td>
																	<td className="py-2.5 px-3 border-r border-slate-100 font-bold">{s.name}</td>
																	<td className="py-2.5 px-3 border-r border-slate-100 text-slate-600">{stat ? stat.last_tm : "데이터 없음"}</td>
																	<td className="py-2.5 px-3 font-semibold text-brand-600">{stat ? `${stat.count.toLocaleString()} 시간` : "0 시간"}</td>
																</tr>
															);
														})}
													</tbody>
												</table>
											</div>
										</div>
									</div>
								)
							)}
						</div>
					</div>
				);
			}

			ReactDOM.createRoot(document.getElementById("root")).render(<MainDashboard />);
		</script>
	</body>
</html>
