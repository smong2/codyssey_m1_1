<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>시계열 예측 | WeatherLoad</title>

		<!-- Tailwind CSS CDN -->
		<script src="https://cdn.tailwindcss.com"></script>
		<!-- React & ReactDOM CDN -->
		<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
		<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
		<!-- Babel (JSX 변환) -->
		<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
		<!-- Lucide Icons -->
		<script src="https://unpkg.com/lucide@latest"></script>
		<!-- Chart.js CDN -->
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

		<!-- Pretendard 폰트 -->
		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

		<style>
			body {
				font-family:
					"Pretendard",
					-apple-system,
					sans-serif;
			}
			::-webkit-scrollbar {
				width: 6px;
				height: 6px;
			}
			::-webkit-scrollbar-thumb {
				background: #cbd5e1;
				border-radius: 3px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
		</style>

		<script>
			tailwind.config = {
				theme: {
					extend: {
						colors: {
							brand: {
								50: "#eff6ff",
								100: "#dbeafe",
								500: "#3b82f6",
								600: "#2563eb",
								700: "#1d4ed8",
								900: "#1e3a8a",
							},
						},
					},
				},
			};
		</script>
	</head>
	<body class="bg-slate-50 text-slate-800 p-4 sm:p-6 lg:p-8">
		<div id="root"></div>

		<script type="text/babel">
			const { useState, useEffect, useRef } = React;

			// 예측 성능 평가지표 (Evaluation Metrics)
			const METRICS = [
				{
					title: "평균 절대 오차 (MAE)",
					value: "0.42 kW",
					desc: "실제 부하와 예측치의 평균 편차",
					status: "우수",
					badgeColor: "bg-emerald-50 text-emerald-700 border-emerald-100",
					icon: "check-circle",
				},
				{
					title: "평균 제곱근 오차 (RMSE)",
					value: "0.58 kW",
					desc: "피크 구간 큰 오차에 민감한 지표",
					status: "양호",
					badgeColor: "bg-blue-50 text-blue-700 border-blue-100",
					icon: "activity",
				},
				{
					title: "평균 절대 백분율 오차 (MAPE)",
					value: "4.85%",
					desc: "전체 부하량 대비 오차 비율 (5% 미만)",
					status: "매우 우수",
					badgeColor: "bg-indigo-50 text-indigo-700 border-indigo-100",
					icon: "percent",
				},
				{
					title: "피크 시점 일치율",
					value: "92.3%",
					desc: "최대 전력 수요 발생 시점(±1시간) 적중률",
					status: "신뢰",
					badgeColor: "bg-purple-50 text-purple-700 border-purple-100",
					icon: "target",
				},
			];

			function ForecastPage() {
				const [modelType, setModelType] = useState("prophet");
				const [horizon, setHorizon] = useState("24h");

				const forecastChartRef = useRef(null);
				const decompChartRef = useRef(null);
				const residualChartRef = useRef(null);

				const forecastInstance = useRef(null);
				const decompInstance = useRef(null);
				const residualInstance = useRef(null);

				useEffect(() => {
					if (window.lucide) window.lucide.createIcons();

					// ── 1. 실제 부하 vs 예측 부하 (24시간~48시간 시계열) ──
					if (forecastChartRef.current) {
						if (forecastInstance.current) forecastInstance.current.destroy();
						const ctx1 = forecastChartRef.current.getContext("2d");

						const timeline = ["D-1 12:00", "15:00", "18:00", "21:00", "00:00", "03:00", "06:00", "09:00", "오늘 12:00(현재)", "15:00", "18:00", "21:00", "00:00", "03:00", "06:00", "09:00", "내일 12:00"];

						// 과거 실측치 (현재 시점 이후는 null)
						const actualData = [7.8, 8.4, 6.2, 4.1, 2.8, 2.1, 3.0, 5.8, 7.9, null, null, null, null, null, null, null, null];

						// 모델 예측치 (과거 구간은 적합선, 미래 구간은 예측선)
						const forecastData = [7.5, 8.2, 6.0, 4.3, 2.6, 2.3, 3.2, 5.6, 7.9, 8.6, 6.8, 4.5, 2.9, 2.2, 3.4, 6.0, 8.3];

						// 상한/하한 신뢰구간 (95% Confidence Interval)
						const upperCI = [null, null, null, null, null, null, null, null, 7.9, 9.4, 7.6, 5.3, 3.6, 2.9, 4.2, 6.9, 9.2];
						const lowerCI = [null, null, null, null, null, null, null, null, 7.9, 7.8, 6.0, 3.7, 2.2, 1.5, 2.6, 5.1, 7.4];

						forecastInstance.current = new Chart(ctx1, {
							type: "line",
							data: {
								labels: timeline,
								datasets: [
									{
										label: "실측 부하 (Actual)",
										data: actualData,
										borderColor: "#1e293b",
										backgroundColor: "#1e293b",
										borderWidth: 2.5,
										pointRadius: 4,
										tension: 0.2,
									},
									{
										label: "예측 부하 (Forecast)",
										data: forecastData,
										borderColor: "#2563eb",
										borderDash: [5, 5],
										borderWidth: 2,
										pointRadius: 3,
										pointBackgroundColor: "#2563eb",
										tension: 0.3,
									},
									{
										label: "예측 상한선 (95% CI)",
										data: upperCI,
										borderColor: "rgba(37, 99, 235, 0.2)",
										backgroundColor: "rgba(37, 99, 235, 0.08)",
										fill: "+1",
										pointRadius: 0,
										borderWidth: 1,
									},
									{
										label: "예측 하한선 (95% CI)",
										data: lowerCI,
										borderColor: "rgba(37, 99, 235, 0.2)",
										pointRadius: 0,
										borderWidth: 1,
										fill: false,
									},
								],
							},
							options: {
								responsive: true,
								maintainAspectRatio: false,
								interaction: { mode: "index", intersect: false },
								plugins: {
									legend: { position: "top", align: "end" },
								},
								scales: {
									y: {
										beginAtZero: true,
										title: { display: true, text: "냉난방 부하 (kW)" },
										grid: { color: "#f1f5f9" },
									},
									x: {
										grid: { display: false },
									},
								},
							},
						});
					}

					// ── 2. 시계열 분해 (추세 + 24시간 계절성) ──
					if (decompChartRef.current) {
						if (decompInstance.current) decompInstance.current.destroy();
						const ctx2 = decompChartRef.current.getContext("2d");

						const decompHours = ["00시", "03시", "06시", "09시", "12시", "15시", "18시", "21시"];
						const seasonalComponent = [-2.8, -3.4, -2.1, 1.4, 3.8, 4.2, 1.1, -1.9];
						const trendComponent = [5.2, 5.2, 5.3, 5.3, 5.4, 5.5, 5.5, 5.6];

						decompInstance.current = new Chart(ctx2, {
							type: "line",
							data: {
								labels: decompHours,
								datasets: [
									{
										label: "일주기 계절성 성분 (Seasonal)",
										data: seasonalComponent,
										borderColor: "#8b5cf6",
										backgroundColor: "rgba(139, 92, 246, 0.1)",
										fill: true,
										tension: 0.35,
										yAxisID: "ySeasonal",
									},
									{
										label: "기저 추세 성분 (Trend)",
										data: trendComponent,
										borderColor: "#f59e0b",
										borderWidth: 2,
										tension: 0.1,
										yAxisID: "yTrend",
									},
								],
							},
							options: {
								responsive: true,
								maintainAspectRatio: false,
								plugins: {
									legend: { position: "top", align: "end" },
								},
								scales: {
									ySeasonal: {
										type: "linear",
										position: "left",
										title: { display: true, text: "계절 변동치 (kW)" },
										grid: { color: "#f1f5f9" },
									},
									yTrend: {
										type: "linear",
										position: "right",
										title: { display: true, text: "추세 기저치 (kW)" },
										grid: { display: false },
										min: 4,
										max: 7,
									},
									x: { grid: { display: false } },
								},
							},
						});
					}

					// ── 3. 예측 잔차(Residual) 오차 분포 ──
					if (residualChartRef.current) {
						if (residualInstance.current) residualInstance.current.destroy();
						const ctx3 = residualChartRef.current.getContext("2d");

						residualInstance.current = new Chart(ctx3, {
							type: "bar",
							data: {
								labels: ["-1.0kW 이하", "-0.6kW", "-0.2kW", "0.0kW(완전일치)", "+0.2kW", "+0.6kW", "+1.0kW 이상"],
								datasets: [
									{
										label: "잔차 빈도수 (Residual Distribution)",
										data: [12, 45, 142, 280, 155, 38, 8],
										backgroundColor: "#38bdf8",
										borderRadius: 6,
									},
								],
							},
							options: {
								responsive: true,
								maintainAspectRatio: false,
								plugins: {
									legend: { display: false },
								},
								scales: {
									y: {
										beginAtZero: true,
										title: { display: true, text: "구간별 빈도(건)" },
										grid: { color: "#f1f5f9" },
									},
									x: { grid: { display: false } },
								},
							},
						});
					}

					return () => {
						if (forecastInstance.current) forecastInstance.current.destroy();
						if (decompInstance.current) decompInstance.current.destroy();
						if (residualInstance.current) residualInstance.current.destroy();
					};
				}, [modelType, horizon]);

				return (
					<div className="max-w-7xl mx-auto space-y-6">
						{/* 상단 컨트롤 바 */}
						<div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
							<div>
								<h1 className="text-xl font-bold text-slate-900">시계열 부하 예측 모델링</h1>
								<p className="text-xs sm:text-sm text-slate-500 mt-0.5">기상 시계열 패턴(계절성·추세) 기반 향후 냉난방 부하 예측 및 오차 검증</p>
							</div>

							<div className="flex flex-wrap items-center gap-3">
								{/* 모델 선택 */}
								<select value={modelType} onChange={(e) => setModelType(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brand-500 outline-none">
									<option value="prophet">Prophet 시계열 모델 (권장)</option>
									<option value="arima">SARIMA (계절형 자기회귀)</option>
									<option value="ema">지수평활법 (Exponential Smoothing)</option>
									<option value="moving_avg">이동평균 베이스라인 (7일)</option>
								</select>

								{/* 예측 구간 선택 */}
								<div className="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold text-slate-600">
									{["24h", "48h", "7d"].map((h) => (
										<button key={h} onClick={() => setHorizon(h)} className={`px-3 py-1.5 rounded-lg transition ${horizon === h ? "bg-white text-brand-600 shadow-sm font-bold" : "hover:text-slate-900"}`}>
											+{h.toUpperCase()} 예측
										</button>
									))}
								</div>
							</div>
						</div>

						{/* ── 1. 예측 성능 지표 카드 4개 ── */}
						<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
							{METRICS.map((m, idx) => (
								<div key={idx} className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition">
									<div className="flex items-center justify-between mb-2">
										<span className="text-xs font-medium text-slate-500">{m.title}</span>
										<span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${m.badgeColor}`}>{m.status}</span>
									</div>
									<div className="text-2xl font-bold text-slate-900">{m.value}</div>
									<p className="mt-1.5 text-xs text-slate-400 leading-tight">{m.desc}</p>
								</div>
							))}
						</div>

						{/* ── 2. 메인 시계열 예측 차트 (실측치 vs 예측치) ── */}
						<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
							<div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
								<div>
									<div className="flex items-center gap-2">
										<span className="text-xs font-bold px-2 py-0.5 rounded bg-brand-100 text-brand-700">시계열 추정</span>
										<h3 className="font-bold text-slate-900 text-base">향후 24시간 냉·난방 부하 예측 곡선</h3>
									</div>
									<p className="text-xs text-slate-400 mt-0.5">실측 과거 데이터와 기상 예보 기반 95% 신뢰구간 부하 예측</p>
								</div>
								<div className="flex items-center gap-2 text-xs">
									<span className="inline-flex items-center gap-1 text-slate-600">
										<span className="w-2.5 h-2.5 bg-slate-800 rounded-full inline-block"></span> 실측치
									</span>
									<span className="inline-flex items-center gap-1 text-brand-600 font-semibold">
										<span className="w-2.5 h-2.5 bg-brand-600 rounded-full inline-block"></span> 예측치
									</span>
								</div>
							</div>
							<div className="h-72 w-full">
								<canvas ref={forecastChartRef}></canvas>
							</div>
						</div>

						{/* ── 3. 하단 서브 차트: 시계열 분해 & 잔차 분포 ── */}
						<div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
							{/* 시계열 분해 차트 (추세/계절성) */}
							<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
								<div className="flex justify-between items-start mb-3">
									<div>
										<h3 className="font-bold text-slate-900 text-base">시계열 분해 성분 (Decomposition)</h3>
										<p className="text-xs text-slate-400 mt-0.5">기저 상승 추세(Trend)와 24시간 주기 일변화(Daily Seasonal)</p>
									</div>
								</div>
								<div className="h-60 w-full">
									<canvas ref={decompChartRef}></canvas>
								</div>
								<div className="mt-3 p-3 bg-slate-50 rounded-xl text-xs text-slate-600">
									💡 <b>해석:</b> 주간 기온 상승으로 기저 추세가 완만히 우상향(+0.4kW/일)하며, 14~15시에 계절성 피크(+4.2kW)가 중첩됩니다.
								</div>
							</div>

							{/* 잔차 정규성 분포 차트 */}
							<div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
								<div className="flex justify-between items-start mb-3">
									<div>
										<h3 className="font-bold text-slate-900 text-base">예측 잔차 오차 분포 (Residuals)</h3>
										<p className="text-xs text-slate-400 mt-0.5">오차의 정규분포(Zero-Mean) 충족 여부 진단</p>
									</div>
								</div>
								<div className="h-60 w-full">
									<canvas ref={residualChartRef}></canvas>
								</div>
								<div className="mt-3 p-3 bg-slate-50 rounded-xl text-xs text-slate-600">
									💡 <b>진단:</b> 오차가 0kW를 중심으로 대칭 종형 곡선을 형성하여 특정 방향으로의 편향(Bias) 없이 잘 학습되었습니다.
								</div>
							</div>
						</div>

						{/* ── 4. 예측 기반 피크 부하 사전 제어 권고 ── */}
						<div className="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
							<div className="space-y-1">
								<div className="flex items-center gap-2">
									<span className="w-2 h-2 rounded-full bg-amber-500"></span>
									<h4 className="font-bold text-slate-900 text-sm">내일 14:00 ~ 16:00 피크 부하(8.6kW) 도달 경보</h4>
								</div>
								<p className="text-xs text-slate-500 leading-relaxed max-w-2xl">예측 모델에 따르면 내일 낮 최고기온(33.1℃) 상승으로 최대 부하가 기준 용량의 85%를 상회할 것으로 예상됩니다. 오전 10:00~11:30 사전 냉각을 통해 전력 피크를 18% 분산시키는 것을 제안합니다.</p>
							</div>
							<button className="whitespace-nowrap bg-brand-50 hover:bg-brand-100 text-brand-700 px-4 py-2 rounded-xl text-xs font-bold transition">부하 분산 시뮬레이션</button>
						</div>
					</div>
				);
			}

			ReactDOM.createRoot(document.getElementById("root")).render(<ForecastPage />);
		</script>
	</body>
</html>
